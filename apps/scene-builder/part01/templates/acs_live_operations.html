<style>
.acl-ops{margin-top:16px}.acl-ops-grid{display:grid;gap:14px}.acl-ops-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(34,45,78,.05)}.acl-ops-card h2{margin:0 0 10px;font-size:16px}.acl-ops-muted{color:var(--muted);font-size:13px}.acl-ops-toolbar,.acl-ops-actions,.acl-ops-pager{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.acl-ops-toolbar input,.acl-ops-toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;min-width:150px}.acl-ops-toolbar input{flex:1;min-width:220px}.acl-ops-btn{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;cursor:pointer;font:inherit}.acl-ops-btn:hover{background:#f5f3ff}.acl-ops-btn.primary{background:#6256e8;color:white;border-color:#6256e8}.acl-ops-btn.danger{color:#b42318;border-color:#f1b5b0}.acl-ops-btn:disabled{opacity:.45;cursor:not-allowed}.acl-ops-table-wrap{overflow:auto}.acl-ops-table{width:100%;border-collapse:collapse;font-size:13px}.acl-ops-table th,.acl-ops-table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}.acl-ops-table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.acl-ops-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;word-break:break-all}.acl-ops-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f0ff;color:#4338ca;font-size:11px}.acl-ops-pill.failed,.acl-ops-pill.cancelled{background:#fff0f0;color:#b42318}.acl-ops-pill.completed{background:#e9f8ef;color:#067647}.acl-ops-pill.running{background:#fff6df;color:#8a5600}.acl-ops-audit{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.acl-ops-alert{display:none;margin-bottom:12px;padding:10px 12px;border-radius:9px;background:#eef2ff;color:#3730a3}.acl-ops-alert.error{background:#fff0f0;color:#b42318}#acl-ops-settings{border:0;border-radius:14px;box-shadow:0 20px 70px #1114;max-width:760px;width:calc(100% - 30px)}#acl-ops-settings pre{max-height:55vh;overflow:auto;background:#101828;color:#e6edf3;padding:14px;border-radius:9px;white-space:pre-wrap}@media(max-width:680px){.acl-ops-toolbar>*{width:100%}.acl-ops-table{min-width:760px}.acl-ops-actions .acl-ops-btn{flex:1}}
</style>
<section class="acl-ops" aria-label="ACS operations"><div id="acl-ops-alert" class="acl-ops-alert"></div><div class="acl-ops-grid">
<section class="acl-ops-card"><h2>Batch actions</h2><div class="acl-ops-muted" style="margin-bottom:10px">The live batch table above remains the single monitoring view. Choose a batch here only when you need a control action.</div><div class="acl-ops-toolbar"><select id="acl-ops-batch"><option value="">Select batch</option></select><button class="acl-ops-btn" id="acl-ops-settings-btn">Settings</button><button class="acl-ops-btn" id="acl-ops-pause-btn">Pause</button><button class="acl-ops-btn danger" id="acl-ops-cancel-batch-btn">Cancel remaining</button></div></section>
<section class="acl-ops-card"><h2>Project search & control</h2><div class="acl-ops-toolbar"><input id="acl-ops-search" placeholder="Project name / Project ID / Job ID / Batch ID"><select id="acl-ops-status"><option value="">All statuses</option><option>queued</option><option>running</option><option>failed</option><option>interrupted</option><option>completed</option><option>cancelled</option></select><button class="acl-ops-btn primary" id="acl-ops-search-btn">Search</button></div><div class="acl-ops-table-wrap" style="margin-top:10px"><table class="acl-ops-table"><thead><tr><th>Project</th><th>Batch</th><th>Status / stage</th><th>Progress</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="acl-ops-jobs"><tr><td colspan="6" class="acl-ops-muted">Loading…</td></tr></tbody></table></div><div class="acl-ops-pager" style="margin-top:10px"><button class="acl-ops-btn" id="acl-ops-prev">Previous</button><span id="acl-ops-page" class="acl-ops-muted"></span><button class="acl-ops-btn" id="acl-ops-next">Next</button></div></section>
<section class="acl-ops-card"><h2>Control audit</h2><div id="acl-ops-audit" class="acl-ops-muted">Loading…</div></section></div></section>
<dialog id="acl-ops-settings"><h2 id="acl-ops-settings-title">Batch settings</h2><pre id="acl-ops-settings-json"></pre><div class="acl-ops-actions"><button class="acl-ops-btn" id="acl-ops-settings-close">Close</button></div></dialog>
<script>
(()=>{const Ops={offset:0,limit:25,total:0,data:null};const opsEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opsFmt=v=>v?new Date(v).toLocaleString():'—';const opsAlert=(m,e=false)=>{const x=document.getElementById('acl-ops-alert');x.textContent=m;x.className='acl-ops-alert'+(e?' error':'');x.style.display='block';setTimeout(()=>x.style.display='none',5000)};async function opsApi(path,options={}){const r=await fetch('/auto-caption/api/acs-control'+path,{cache:'no-store',headers:{'Content-Type':'application/json'},credentials:'same-origin',...options});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}function renderOpsBatches(){const sel=document.getElementById('acl-ops-batch'),old=sel.value,b=Ops.data?.batches||[];sel.innerHTML='<option value="">Select batch</option>'+b.map(x=>`<option value="${opsEsc(x.id)}">${opsEsc(x.category||'Uncategorized')} · ${opsEsc(x.id)}</option>`).join('');if(b.some(x=>String(x.id)===old))sel.value=old;updateBatchActionLabel()}function selectedBatch(){const id=document.getElementById('acl-ops-batch').value;return (Ops.data?.batches||[]).find(b=>String(b.id)===id)}function updateBatchActionLabel(){const b=selectedBatch(),btn=document.getElementById('acl-ops-pause-btn'),paused=String(b?.control_state||'').toLowerCase()==='paused';btn.textContent=paused?'Resume':'Pause';['acl-ops-settings-btn','acl-ops-pause-btn','acl-ops-cancel-batch-btn'].forEach(id=>document.getElementById(id).disabled=!b)}function renderOpsJobs(){const d=Ops.data?.jobs||{items:[],total:0},items=d.items||[];document.getElementById('acl-ops-jobs').innerHTML=items.length?items.map(j=>{const retry=['failed','cancelled','interrupted'].includes(j.status),cancel=!['completed','failed','cancelled'].includes(j.status);return `<tr><td><b>${opsEsc(j.project_name)}</b><div class="acl-ops-code">${opsEsc(j.id)}</div></td><td class="acl-ops-code">${opsEsc(j.batch_id||'legacy')}</td><td><span class="acl-ops-pill ${opsEsc(j.status)}">${opsEsc(j.status)}</span><div class="acl-ops-muted">${opsEsc(j.pipeline_stage||j.current_stage||'')}</div>${j.error_text?`<div class="acl-ops-muted">${opsEsc(j.error_text)}</div>`:''}</td><td>${Number(j.progress)||0}%</td><td>${opsEsc(opsFmt(j.updated_at))}</td><td><div class="acl-ops-actions">${cancel?`<button class="acl-ops-btn danger" data-job="${opsEsc(j.id)}" data-action="cancel">Cancel</button>`:''}${retry?`<button class="acl-ops-btn" data-job="${opsEsc(j.id)}" data-action="retry">Retry</button>`:''}${j.drive_web_url?`<a class="acl-ops-btn" href="${opsEsc(j.drive_web_url)}" target="_blank" rel="noopener">Drive</a>`:''}</div></td></tr>`}).join(''):'<tr><td colspan="6" class="acl-ops-muted">No matching projects</td></tr>';Ops.total=d.total||0;document.getElementById('acl-ops-page').textContent=`${Ops.total?Ops.offset+1:0}–${Math.min(Ops.offset+Ops.limit,Ops.total)} of ${Ops.total}`;document.getElementById('acl-ops-prev').disabled=Ops.offset===0;document.getElementById('acl-ops-next').disabled=Ops.offset+Ops.limit>=Ops.total;document.querySelectorAll('[data-job][data-action]').forEach(b=>b.onclick=()=>jobAction(b.dataset.job,b.dataset.action))}function renderOpsAudit(){const items=Ops.data?.audit||[];document.getElementById('acl-ops-audit').innerHTML=items.length?items.slice(0,15).map(x=>`<div class="acl-ops-audit"><span><b>${opsEsc(String(x.action||'').replaceAll('_',' '))}</b><br><span class="acl-ops-code">${opsEsc(x.target_id)}</span></span><span class="acl-ops-muted">${opsEsc(x.actor)}<br>${opsEsc(opsFmt(x.created_at))}</span></div>`).join(''):'No control actions recorded yet.'}async function loadOps(reset=false){if(reset)Ops.offset=0;try{const p=new URLSearchParams({q:document.getElementById('acl-ops-search').value,status:document.getElementById('acl-ops-status').value,limit:Ops.limit,offset:Ops.offset});Ops.data=await opsApi('/snapshot?'+p);renderOpsBatches();renderOpsJobs();renderOpsAudit()}catch(e){opsAlert('ACS operations unavailable: '+e.message,true)}}async function jobAction(id,action){if(action==='cancel'&&!confirm('Cancel this project? The database history will be retained.'))return;try{await opsApi(`/jobs/${encodeURIComponent(id)}/${action}`,{method:'POST'});opsAlert(`Project ${action} accepted`);loadOps()}catch(e){opsAlert(e.message,true)}}async function batchAction(action){const b=selectedBatch();if(!b)return;try{await opsApi(`/batches/${encodeURIComponent(b.id)}/${action}`,{method:'POST'});opsAlert(`Batch ${action} accepted`);loadOps()}catch(e){opsAlert(e.message,true)}}async function showSettings(){const b=selectedBatch();if(!b)return;try{const d=await opsApi('/batches/'+encodeURIComponent(b.id));document.getElementById('acl-ops-settings-title').textContent='Batch settings · '+b.id;document.getElementById('acl-ops-settings-json').textContent=JSON.stringify({batch:d.batch,counts:d.counts},null,2);document.getElementById('acl-ops-settings').showModal()}catch(e){opsAlert(e.message,true)}}async function cancelRemaining(){const b=selectedBatch();if(!b)return;const value=prompt(`Type the exact batch ID to cancel all remaining projects:\n${b.id}`);if(value===null)return;try{await opsApi(`/batches/${encodeURIComponent(b.id)}/cancel-remaining`,{method:'POST',body:JSON.stringify({confirmation:value})});opsAlert('Batch cancellation requests recorded');loadOps()}catch(e){opsAlert(e.message,true)}}document.getElementById('acl-ops-search-btn').onclick=()=>loadOps(true);document.getElementById('acl-ops-search').onkeydown=e=>{if(e.key==='Enter')loadOps(true)};document.getElementById('acl-ops-status').onchange=()=>loadOps(true);document.getElementById('acl-ops-prev').onclick=()=>{Ops.offset=Math.max(0,Ops.offset-Ops.limit);loadOps()};document.getElementById('acl-ops-next').onclick=()=>{Ops.offset+=Ops.limit;loadOps()};document.getElementById('acl-ops-batch').onchange=updateBatchActionLabel;document.getElementById('acl-ops-settings-btn').onclick=showSettings;document.getElementById('acl-ops-pause-btn').onclick=()=>{const b=selectedBatch();batchAction(String(b?.control_state||'').toLowerCase()==='paused'?'resume':'pause')};document.getElementById('acl-ops-cancel-batch-btn').onclick=cancelRemaining;document.getElementById('acl-ops-settings-close').onclick=()=>document.getElementById('acl-ops-settings').close();loadOps();setInterval(loadOps,15000)})();
</script>
