{% extends "base.html" %}
{% block title %}Auto Caption Studio{% endblock %}
{% block subtitle %}Caption, media, presets, and final-video production workspace{% endblock %}
{% block content %}
<!-- Native Auto Caption Studio Integration Container -->
<div id="acs-native-app-root" style="width:100%; min-height:85vh;">
  <div style="padding: 60px; text-align: center; color: var(--sb-muted, #64748b);">
    <h3>Loading Auto Caption Studio Workspace...</h3>
  </div>
</div>
<script>
// Fetch and mount the native ACS view directly into the page without any nested iframe or double sidebar!
async function loadNativeACS() {
    const hash = window.location.hash || '#queue';
    const targetUrl = '/auto-caption/api/web-flow/studio?embed=1' + hash;
    try {
        const response = await fetch(targetUrl);
        if (response.ok) {
            const html = await response.text();
            const root = document.getElementById('acs-native-app-root');
            if (root) {
                root.innerHTML = html;
                // Execute any scripts embedded in the loaded HTML
                Array.from(root.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }
        }
    } catch (e) {
        console.error("Failed to load native ACS view:", e);
    }
}
loadNativeACS();
// ACS itself handles tab hash changes; never refetch and reexecute all scripts.
</script>
{% endblock %}
