server {
    server_name app.scenebuilder.online;
    client_max_body_size 5000M;


    location = /_internal/auto-caption-auth {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/auto-caption-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_internal/local-upload-manager-auth {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/local-upload-manager-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @lum_login {
        return 302 /login;
    }

    location = /auto-caption {
        return 302 /auto-caption/live;
    }

    location ^~ /auto-caption/api/ {
        auth_request /_internal/auto-caption-auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $app_access $upstream_http_x_app_access;

        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /auto-caption;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-App-Access $app_access;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /auto-caption/ {
        return 302 /auto-caption/live;
    }

location = /auto-caption/live {
    proxy_pass http://127.0.0.1:8080/auto-caption/live;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /auto-caption/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.scenebuilder.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.scenebuilder.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # BEGIN LUM PUBLIC LEGAL PAGES V4
    location = /lum-oauth {
        alias /var/www/lum-public-v4/oauth.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header X-LUM-Public-Page "oauth";
    }

    location = /lum-privacy {
        alias /var/www/lum-public-v4/privacy.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header X-LUM-Public-Page "privacy";
    }

    location = /lum-terms {
        alias /var/www/lum-public-v4/terms.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header X-LUM-Public-Page "terms";
    }
    # END LUM PUBLIC LEGAL PAGES V4

    # BEGIN LOCAL UPLOAD MANAGER ROUTE
    location = /LUM {
        return 308 /LUM/;
    }

    location = /LUM/health {
        proxy_pass http://127.0.0.1:8015/LUM/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /LUM/ {
        auth_request /_internal/local-upload-manager-auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $app_access $upstream_http_x_app_access;
        auth_request_set $is_admin $upstream_http_x_is_admin;
        error_page 401 = @lum_login;

        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /LUM;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-App-Access $app_access;
        proxy_set_header X-Is-Admin $is_admin;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 8m;
    }
    # END LOCAL UPLOAD MANAGER ROUTE

    # BEGIN ALGROW LIVE BROWSER WEBSOCKET V2
    # Keep VNC/noVNC localhost-only. The authenticated Scene Builder WebSocket
    # route performs the application-level authorization and bridges to noVNC.
    location = /algrow-voice/viewer/websockify {
        proxy_pass http://127.0.0.1:8080/algrow-voice/viewer/websockify;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 15s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
    # END ALGROW LIVE BROWSER WEBSOCKET V2


    # BEGIN LUM CONNECTION TEST ROUTE
    location = /lumconnection {
        return 308 /lumconnection/;
    }

    location = /lumconnection/health {
        proxy_pass http://127.0.0.1:8016/lumconnection/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /lumconnection/ {
        auth_request /_internal/local-upload-manager-auth;
        error_page 401 = @lum_login;
        auth_request_set $lumconnection_user $upstream_http_x_auth_user;
        auth_request_set $lumconnection_access $upstream_http_x_app_access;
        auth_request_set $lumconnection_admin $upstream_http_x_is_admin;
        proxy_set_header X-Auth-User $lumconnection_user;
        proxy_set_header X-App-Access $lumconnection_access;
        proxy_set_header X-Is-Admin $lumconnection_admin;
        proxy_pass http://127.0.0.1:8016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # END LUM CONNECTION TEST ROUTE
}
server {
    if ($host = app.scenebuilder.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.scenebuilder.online;
    return 404; # managed by Certbot


}
