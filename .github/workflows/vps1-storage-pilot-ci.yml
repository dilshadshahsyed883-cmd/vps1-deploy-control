name: VPS1 GitHub Storage Pilot — offline gated verification
on:
  pull_request:
    paths:
      - 'apps/vps-storage-manager/**'
      - 'rebuild/pilots/install_storage_manager_candidate.py'
      - 'rebuild/tests/test_storage_manager_candidate.py'
      - '.github/workflows/vps1-storage-pilot-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-storage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove fail-closed production flags, isolated source and app test
        run: |
          set -Eeuo pipefail
          python3 -m unittest rebuild.tests.test_storage_manager_candidate -v
          python3 - <<'PY'
          from pathlib import Path
          import ast
          ast.parse(Path("rebuild/pilots/install_storage_manager_candidate.py").read_text())
          text=Path("rebuild/pilots/install_storage_manager_candidate.py").read_text()
          assert "NoNewPrivileges" in Path("apps/vps-storage-manager/candidate/vps1-storage-candidate.service").read_text()
          assert "raw.githubusercontent.com" in text
          assert "GITHUB_STORAGE_PILOT:" in text
          PY
