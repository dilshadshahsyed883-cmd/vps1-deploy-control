name: VPS1 Short Studio copy and isolation gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'jinja2==3.1.6' 'httpx==0.28.1'
      - name: Compile changed Python source
        run: |
          python -m py_compile production/song_uploader_group_summary_release.py production/short_uploader_group_release.py production/workers.py production/runtime.py production/short_studio_release.py production/shortstudio_readonly_diagnostic.py production/test_short_studio_v1.py production/test_shortstudio_readonly_diagnostic.py apps/short-maker/part01/app.py apps/scene-builder/part01/app.py apps/local-upload-manager/part01/lum_engine/standalone_app.py apps/local-upload-manager/part01/lum_engine/auto_engine_v6.py
      - name: Compile and test Short Uploader isolated network and scheduler fix
        run: |
          python -m py_compile apps/local-upload-manager/part01/lum_engine/auto_engine_v6_scheduler.py apps/local-upload-manager/part01/lum_engine/auto_engine_v6_worker.py apps/local-upload-manager/part01/desktop_core/modules/db/queue_repository.py production/short_uploader_group_release.py
          python -m unittest discover -s tests -p 'test_short_uploader_network_schedule_fairness.py' -v
      - name: Verify native Studio JavaScript syntax
        run: |
          node --check apps/scene-builder/part01/static/vps1_native_site_shell.js
          for file in apps/local-upload-manager/part01/static/{auto_engine_v6,channels_subtabs_v5_1,navigation_state_v1,lum_ux_state_v2}.js; do node --check "$file"; done
      - name: Verify Short Maker resumable browser JavaScript syntax
        run: node --check apps/short-maker/part01/resumable_client.js
      - name: Verify refresh recovery, upload offsets, and idempotent job creation
        run: python -m unittest discover -s tests -p "test_short_maker_resume.py" -v
      - name: Install isolated Short Maker HTTP test dependencies
        run: python -m pip install 'fastapi==0.115.12' 'pillow==11.1.0' 'python-multipart==0.0.20'
      - name: Verify resumable Short Maker HTTP API handles refresh and duplicate finalize
        run: python -m unittest discover -s tests -p 'test_short_maker_resume_integration.py' -v
      - name: Offline Shorts, Song and Scene regression contracts
        run: |
          python -m unittest -v production.test_short_studio_v1 production.test_shortstudio_readonly_diagnostic production.test_song_uploader_v1 production.test_uploader_three_mode_split production.test_unified_sidebar_navigation production.test_scene_video_studio_shell
      - name: Song Uploader group profile restoration regression
        run: python -m unittest discover -s tests -p 'test_song_uploader_group_profile_restore.py' -v
      - name: Song Uploader dashboard, settings and candidate action guard regressions
        run: python -m unittest discover -s tests -p 'test_song_uploader_modes_settings.py' -v
      - name: Verify Song Uploader source switching and manual metadata safety
        run: python -m unittest discover -s tests -p 'test_song_uploader_manual_metadata.py' -v
      - name: Verify Song Uploader minimal Auto Engine stays song-only
        run: python -m unittest discover -s tests -p 'test_song_uploader_minimal_ui.py' -v
      - name: Verify Song Uploader group summary and legacy profile safety
        run: python -m unittest discover -s tests -p 'test_song_uploader_group_summary.py' -v
      - name: Verify Short Maker VPS folder handoff and safe cleanup regressions
        run: python -m unittest discover -s tests -p 'test_short_studio_folder_handoff.py' -v
      - name: Short Maker compact batch details modal regression
        run: python -m unittest discover -s tests -p 'test_short_maker_queue_modal.py' -v
      - name: Short Uploader group metadata and queue regressions
        run: python -m unittest discover -s tests -p 'test_short_uploader_group_metadata.py' -v
      - name: Verify Short-only channel cleanup and permanently enabled modes
        run: |
          python -m unittest discover -s tests -p 'test_short_uploader_fixed_modes.py' -v
          python -m unittest discover -s tests -p 'test_shared_uploader_admin_controls_ui.py' -v
      - name: Short Uploader final release scope and live acceptance guards
        run: python -m unittest discover -s tests -p 'test_short_uploader_final_release.py' -v
      - name: Install rendered UI test browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify Short Uploader at five desktop and mobile widths
        run: python -m production.short_uploader_final_browser
      - name: Verify Song Uploader responsive cards and independent badges at six widths
        run: python -m production.song_uploader_status_mobile_browser
      - name: Short Studio profile Start/Pause and per-video schedule regression
        run: python -m unittest discover -s tests -p 'test_short_studio_profile_controls.py' -v
      - name: Forbid changed credentials and activation
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -R 'LUM_ENGINE_INSTANCE=shortstudio.*engine_enabled=1' production apps
          grep -q '"shortstudio"' production/workers.py
          grep -q 'AUTO_SCRIPT=OFFLINE' .github/workflows/vps1-short-studio-release.yml

