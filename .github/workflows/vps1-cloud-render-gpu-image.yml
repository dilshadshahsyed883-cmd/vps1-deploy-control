name: Concat GPU worker — build, smoke, publish candidate

on:
  push:
    branches: [main]
    paths:
      - cloud_render/concat/**
      - .github/workflows/vps1-cloud-render-gpu-image.yml
  pull_request:
    paths:
      - cloud_render/concat/**
      - .github/workflows/vps1-cloud-render-gpu-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: concat-gpu-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the precise trusted PR head for a reproducible candidate tag.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source lock, packaging and HTTP worker tests
        run: |
          python -m unittest discover -s cloud_render/concat/tests -v
          python -m py_compile cloud_render/concat/gpu/worker.py
      - name: Build CUDA-only candidate image (no native Rust or Vulkan)
        run: |
          docker build --progress=plain -f cloud_render/concat/gpu/Dockerfile -t concat-gpu-worker:smoke .

      - name: Assert retired CLI/Vulkan not packaged
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 concat-gpu-worker:smoke -c '
          import os, importlib.util
          from pathlib import Path
          assert not Path("/usr/local/bin/concat-cli").exists()
          assert not Path("/opt/concat/ffmpeg/lib").exists()
          assert not Path("/usr/share/vulkan/icd.d/lvp_icd.x86_64.json").exists()
          assert importlib.util.find_spec("cloud_render.concat.gpu.simple_timeline_v1")
          print("Native CLI/Vulkan engine absent; CUDA module available")
          '

      - name: Smoke CUDA-only HTTP readiness and authentication without GPU
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs concat-gpu-smoke || true; docker rm -f concat-gpu-smoke || true' EXIT
          docker run --detach --name concat-gpu-smoke -p 127.0.0.1:8080:8080 \
            -e RENDERER_API_TOKEN=ci_smoke_0123456789abcdefghijklmnopqrstuvwxyz \
            concat-gpu-worker:smoke
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:8080/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health/ready | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["engine"]=="cuda-nvenc-stage1" and r["cuda_stage1"] and r["native_vulkan"] is False'
          docker exec concat-gpu-smoke python3 -m cloud_render.concat.gpu.simple_timeline_v1 --help >/dev/null
          docker exec concat-gpu-smoke python3 -c 'import socket; s=socket.create_connection(("::1", 8080), timeout=5); s.sendall(b"GET /health/ready HTTP/1.1\r\nHost: [::1]\r\nConnection: close\r\n\r\n"); assert b"200 OK" in s.recv(4096)'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/jobs/test)" = "401"
          # Native Vulkan upload is explicitly rejected before any ZIP transfer.
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci_smoke_0123456789abcdefghijklmnopqrstuvwxyz' -H 'Content-Type: application/json' -d '{"size":1024,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","render_mode":"native"}' http://127.0.0.1:8080/api/uploads/legacy-test)" = "400"
          docker rm -f concat-gpu-smoke
          trap - EXIT

      - name: Publish checksum-addressable candidate to GHCR
        # main retains its existing release lane. One deliberately scoped,
        # same-repository PR can publish a NON-PRODUCTION TEST tag without
        # merging unfinished experimental GPU code into protected main.
        # Fork PRs and every other PR are excluded from registry publishing.
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.number == 707 &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref == 'feature/concat-cuda-simple-timeline-v1-20261107')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$EVENT_NAME" = pull_request ]; then
            IMAGE="ghcr.io/${OWNER,,}/concat-gpu-worker:candidate-pr707-${SOURCE_SHA}"
          else
            IMAGE="ghcr.io/${OWNER,,}/concat-gpu-worker:candidate-${SOURCE_SHA}"
          fi
          docker tag concat-gpu-worker:smoke "$IMAGE"
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}'
          echo "Published candidate: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "This is NOT Salad GPU validated or production ready." >> "$GITHUB_STEP_SUMMARY"
