name: Scene Builder public HTTPS and source upgrade (offline only)
on:
  pull_request:
    paths:
      - 'production/scene_public_https.py'
      - 'production/scene_login_upgrade.py'
      - 'production/route_uploader_scene_https.py'
      - 'production/test_uploader_scene_https.py'
      - 'production/scene_uploader_ui_release.py'
      - 'production/test_scene_uploader_ui_release.py'
      - 'production/gateway.py'
      - '.github/workflows/vps1-production.yml'
      - 'apps/scene-builder/part01/templates/local_upload_manager.html'
      - 'apps/scene-builder/part01/templates/base.html'
      - 'apps/scene-builder/part01/templates/acs_studio_shell.html'
      - 'apps/scene-builder/part01/templates/video_studio_embed.html'
      - 'apps/scene-builder/part01/app.py'
      - 'production/test_scene_video_studio_shell.py'
      - 'apps/scene-builder/part01/static/lum_host_state_v1.js'
      - 'rebuild/tests/test_scene_public_https.py'
      - '.github/workflows/vps1-scene-public-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-domain-and-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and immutable source/rollback constraints
        run: python3 -m unittest rebuild.tests.test_scene_public_https -v
      - name: Nginx syntax (isolated temp test, no production gateway)
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python3 - <<'PY'
          import tempfile,subprocess
          from pathlib import Path
          from production.scene_public_https import nginx_http_only,nginx_https
          with tempfile.TemporaryDirectory() as t:
              root=Path(t)
              crt=root/'local.crt';key=root/'local.key'
              subprocess.run(['openssl','req','-x509','-newkey','rsa:2048',
                '-nodes','-keyout',str(key),'-out',str(crt),
                '-days','1','-subj','/CN=app.scenebuilder.online'],
                capture_output=True,check=True,timeout=15)
              for name,body in [('acme',nginx_http_only()),('tls',nginx_https())]:
                  body=body.replace('/etc/letsencrypt/live/app.scenebuilder.online/fullchain.pem',str(crt))
                  body=body.replace('/etc/letsencrypt/live/app.scenebuilder.online/privkey.pem',str(key))
                  conf=root/(name+'.conf')
                  conf.write_text('events {} \n http { \n'+body+'\n }\n')
                  test=subprocess.run(['sudo','nginx','-t','-p',t,'-c',str(conf)],
                    capture_output=True,text=True)
                  assert test.returncode==0,(name,test.stderr)
          PY
      - name: Validate Scene authenticated Auto Uploader Nginx route
        run: python3 -m unittest production.test_uploader_scene_https production.test_scene_uploader_ui_release production.test_scene_video_studio_shell -v
      - name: Prove no website/worker/legacy remote action enabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          g=json.loads(Path('rebuild/groups.json').read_text())
          assert g['offline_applications']==['auto-script']
          assert not g['production_deploy_enabled'] and not g['fresh_install_enabled']
          # Production HTTPS GitHub CI must not SSH, touch VPS or invoke certbot.
          code=Path('.github/workflows/vps1-scene-public-ci.yml').read_text()
          assert ('ssh' + ' -T') not in code and ('certbot' + ' certonly') not in code
          PY
