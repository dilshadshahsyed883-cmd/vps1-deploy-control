name: VPS1 Copyright Studio CI
on: [pull_request, push]
permissions:
  contents: read
jobs:
  copyright-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'jinja2==3.1.6'
      - name: Syntax verification
        run: |
          python -m py_compile apps/video-merger/part01/app.py apps/copyright-uploader/part01/lum_engine/standalone_app.py apps/copyright-uploader/part01/lum_engine/copyright_vault.py apps/copyright-uploader/part01/lum_engine/project_store.py apps/copyright-uploader/part01/lum_engine/worker.py production/copyright_studio_release.py production/copyright_scene_nav_release.py production/runtime.py production/smoke.py
          node --check apps/scene-builder/part01/static/vps1_native_site_shell.js
          node --check apps/copyright-uploader/part01/static/lum_ux_state_v2.js
      - name: Full isolated Copyright Uploader runtime dependencies
        run: python -m pip install -r apps/copyright-uploader/part01/requirements.txt
      - name: Disposable authenticated health and manual UI smoke (no uploads)
        run: python -m production.smoke --app copyright-uploader
      - name: Durable queue and isolated studio offline regressions
        run: python -m unittest discover -s tests -p 'test_copyright_studio_v2.py' -v
      - name: Copyright folder picker, queue exclusivity, cleanup and sidebar regressions
        run: |
          python -m unittest discover -s tests -p 'test_copyright_video_picker_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_copyright_sidebar_consistency.py' -v
          node --check apps/copyright-uploader/part01/static/copyright_video_picker.js
      - name: Copyright safe cancellation, atomic worker claim and cleanup UI
        run: python -m unittest discover -s tests -p 'test_copyright_queue_claim_cancel.py' -v
      - name: Copyright compact UI and isolated release regressions
        run: python -m unittest discover -s tests -p 'test_copyright_uploader_ui.py' -v
      - name: Copyright non-admin manual handover and tenant regression
        run: python -m unittest discover -s tests -p 'test_copyright_member_handover.py' -v
      - name: Copyright owner-private PC OAuth and authorized-token JSON Vault
        run: python -m unittest discover -s tests -p 'test_copyright_pc_vault_restore.py' -v
      - name: Copyright owner-only Google Sheet groups and OAuth preservation
        run: python -m unittest discover -s tests -p 'test_copyright_owned_sheet_groups.py' -v
      - name: Copyright fixed-mode and no-manual-channel regression
        run: python -m unittest discover -s tests -p 'test_copyright_mode_cleanup.py' -v
      - name: Rendered responsive workspace and interaction checks (no uploads)
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python -m production.copyright_uploader_browser
      - name: Existing Studio navigation regression
        run: python -m unittest -v production.test_canonical_studio_navigation production.test_unified_sidebar_navigation
      - name: No Copyright Auto Engine scheduler
        run: |
          ! grep -R 'lum-copyright-scheduler' production/workers.py
          grep -q 'AUTO_SCRIPT=OFFLINE' .github/workflows/vps1-short-studio-release.yml
