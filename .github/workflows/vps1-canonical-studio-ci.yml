name: VPS1 canonical Studio URL and refresh-state CI
on:
  pull_request:
    paths:
      - 'apps/auto-caption-studio/part01/web_backend/**'
      - 'apps/scene-builder/part01/**'
      - 'production/test_canonical_studio_navigation.py'
      - '.github/workflows/vps1-canonical-studio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python source syntax
        run: python3 -m py_compile apps/auto-caption-studio/part01/web_backend/app.py apps/auto-caption-studio/part01/web_backend/web_flow_api.py apps/scene-builder/part01/app.py
      - name: Canonical routes, tab memory, polling and no-frame contracts
        run: python3 -m unittest production.test_canonical_studio_navigation -v
