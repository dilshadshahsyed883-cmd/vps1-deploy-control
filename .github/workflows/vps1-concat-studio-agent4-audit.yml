name: VPS1 Concat Studio Agent 4 owner security audit (offline)
on:
  push:
    branches:
      - 'audit/concat-studio-user-isolation-*'
    paths:
      - 'tests/test_concat_studio_isolation_audit.py'
      - 'docs/audits/CONCAT_STUDIO_AGENT4_OWNER_ISOLATION_20261118.md'
      - '.github/workflows/vps1-concat-studio-agent4-audit.yml'
  pull_request:
    paths:
      - 'tests/test_concat_studio_isolation_audit.py'
      - 'docs/audits/CONCAT_STUDIO_AGENT4_OWNER_ISOLATION_20261118.md'
      - '.github/workflows/vps1-concat-studio-agent4-audit.yml'
permissions:
  contents: read
jobs:
  offline-isolation-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated HTTP test imports only
        run: python -m pip install 'fastapi>=0.110,<1' 'requests>=2.31,<3' 'httpx>=0.27,<1' 'jinja2>=3,<4' 'itsdangerous>=2.2,<3'
      - name: Syntax verify audit test
        run: python -m py_compile tests/test_concat_studio_isolation_audit.py
      - name: Run temporary-fixture security tests without production access
        run: python -m unittest tests.test_concat_studio_isolation_audit tests.test_cloud_render_copy_link -v
