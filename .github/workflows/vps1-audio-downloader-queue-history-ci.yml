name: VPS1 Audio Downloader queue/history CI
on:
  pull_request:
    paths:
      - 'apps/voice-studio/part01/templates/voice_studio.html'
      - 'apps/voice-studio/part01/audio_downloader_api.py'
      - 'production/voice_template_release.py'
      - 'tests/test_audio_downloader_queue_history.py'
      - 'tests/test_audio_downloader_proxy.py'
      - 'tests/test_audio_downloader_thumbnail.py'
      - 'tests/test_audio_downloader_upload_retry.py'
      - 'production/runtime.py'
      - '.github/workflows/vps1-audio-thumbnail-release.yml'
      - 'production/audio_downloader*.py'
      - '.github/workflows/vps1-audio-proxy-release.yml'
      - 'tests/audio_downloader_browser_urls.test.cjs'
      - '.github/workflows/vps1-audio-downloader-queue-history-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-downloader-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated backend test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pydantic>=2,<3' 'yt-dlp==2026.8.19'
      - name: Persistent queue/history regression
        run: python -m unittest discover -s tests -p test_audio_downloader_queue_history.py -v
      - name: Proxy, private session, worker and guarded release regression
        run: python -m unittest discover -s tests -p test_audio_downloader_proxy.py -v
      - name: Thumbnail pairing, Drive integrity and browser checkbox regression
        run: python -m unittest discover -s tests -p test_audio_downloader_thumbnail.py -v
      - name: Drive pacing, automatic retries and interrupted upload recovery
        run: python -m unittest discover -s tests -p test_audio_downloader_upload_retry.py -v
      - name: Check isolated Audio Downloader JavaScript syntax
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const text=fs.readFileSync('apps/voice-studio/part01/templates/voice_studio.html','utf8');
          for(const id of ['audio-downloader-v1-js','audio-downloader-proxy-v1']){
            const re=new RegExp('<script id="'+id+'">([\\s\\S]*?)<\\/script>');
            const m=text.match(re);
            if(!m) throw new Error('Missing script '+id);
            new vm.Script(m[1],{filename:id+'.js'});
          }
          JS
      - name: Execute actual Queue and History JavaScript after Nginx rewriting simulation
        run: node tests/audio_downloader_browser_urls.test.cjs
