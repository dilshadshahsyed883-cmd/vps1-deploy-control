name: VPS1 Storage Manager backend retirement release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vps1-storage-backend-retirement
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.actor == 'dilshadshahsyed883-cmd' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[vps1-storage-backend-retirement-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Install only Storage Manager and verify retired collectors
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"; trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"; unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/identity"
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          test "$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          remote() { timeout 2400s ssh -T -i "$scratch/identity" -o UserKnownHostsFile="$scratch/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no vps1deploy@100.87.55.92 "$@"; }
          remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA vps-storage-manager"
          remote "curl -fsS http://127.0.0.1:8149/health | grep -q '\"ok\":true'"
          remote "curl -fsS -H 'X-Storage-Token: ' http://127.0.0.1:8149/v1/metrics >/dev/null || true"
          echo 'STORAGE_BACKEND=PASS'
          echo 'SERVICE_PROCESS_COLLECTORS=ABSENT_BY_SOURCE_CONTRACT'
          echo 'CLEANUP_NOT_EXECUTED=YES'
          echo 'AUTO_SCRIPT=OFFLINE'
