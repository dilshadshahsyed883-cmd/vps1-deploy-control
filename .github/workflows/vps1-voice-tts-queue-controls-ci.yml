name: Voice TTS durable queue controls (isolated)
on:
  pull_request:
    paths:
      - 'apps/voice-studio/part01/kokoro_api.py'
      - 'apps/voice-studio/part01/edge_api.py'
      - 'apps/voice-studio/part01/queue_actions.py'
      - 'apps/voice-studio/part02/kokoro_worker.py'
      - 'apps/voice-studio/part03/edge_worker.py'
      - 'apps/voice-studio/part01/templates/voice_studio.html'
      - 'tests/test_voice_tts_queue_actions.py'
      - 'tests/test_voice_tts_controls_release.py'
      - 'tests/test_voice_tts_queue_http.py'
      - 'production/voice_tts_controls_release.py'
      - 'production/runtime.py'
      - '.github/workflows/vps1-voice-tts-queue-controls-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/voice-studio/part01/queue_actions.py'
      - 'tests/test_voice_tts_queue_actions.py'
permissions:
  contents: read
jobs:
  queue-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated API test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'pydantic>=2,<3'
      - name: Verify SQLite, workers, lifecycle and actual FastAPI routes
        run: python -m unittest tests.test_voice_tts_queue_actions tests.test_voice_tts_controls_release tests.test_voice_tts_queue_http -v
      - name: Validate independent Python source syntax
        run: |
          python -m py_compile production/voice_tts_controls_release.py production/runtime.py \
            apps/voice-studio/part01/queue_actions.py \
            apps/voice-studio/part01/kokoro_api.py \
            apps/voice-studio/part01/edge_api.py \
            apps/voice-studio/part02/kokoro_worker.py \
            apps/voice-studio/part03/edge_worker.py
      - name: Validate Voice inline JavaScript parser
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('apps/voice-studio/part01/templates/voice_studio.html').read_text()
          for identity in ('voiceStudioDualEngineV1Script','voiceStudioEdgeEngineV1Script'):
              found=re.search(r'<script id="'+identity+r'">([\s\S]*?)</script>',src)
              assert found,identity
              Path('/tmp/'+identity+'.js').write_text(found.group(1))
          PY
          node --check /tmp/voiceStudioDualEngineV1Script.js
          node --check /tmp/voiceStudioEdgeEngineV1Script.js
