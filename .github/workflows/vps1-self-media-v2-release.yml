name: VPS1 Self Media Library V2 guarded production release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: vps1-sml-v2-app-release
  cancel-in-progress: false
jobs:
  install-app:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      github.run_attempt == 1 &&
      (contains(github.event.head_commit.message, '[vps1-self-media-v2-release]') || contains(github.event.head_commit.message, '[vps1-sml-local-release]'))
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Idle preflight, SML-only immutable install, health readback and rollback
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/id"
          unset PRIVATE_IDENTITY
          chmod 600 "$scratch/id"
          ssh-keygen -y -P '' -f "$scratch/id" > "$scratch/public"
          test "$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')" = \
            'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          remote() {
            timeout 1500s ssh -T -p 22 -i "$scratch/id" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 "$@"
          }
          # Never interrupt a real media processor. Poll read-only for up to
          # 20 minutes; fail closed on unhealthy API/SSH or a persistently busy app.
          echo "READ_ONLY_IDLE_PREFLIGHT"
          for idle_attempt in $(seq 1 40); do
            if remote 'python3 -' <<'PY'
          import json,urllib.request
          def read(p):
              with urllib.request.urlopen('http://127.0.0.1:8147'+p,timeout=15) as r:
                  if r.status!=200:raise RuntimeError('HTTP health failed')
                  return json.load(r)
          health=read('/api/health')
          stats=read('/api/stats')
          if not health.get('ok'):
              raise RuntimeError('SML health failed; abort without deployment')
          processing=int(stats.get('processing',-1))
          imports=int(read('/api/v1/media/status').get('imports_processing',-1))
          if processing < 0 or imports < 0:
              raise RuntimeError('SML processing/import count unknown; abort without deployment')
          if processing or imports:
              print('SML_ACTIVE_PROCESSING='+str(processing)+' IMPORTS='+str(imports),flush=True)
              raise SystemExit(20)
          print('SML_IDLE_PREFLIGHT=PASS',flush=True)
          PY
            then
              break
            else
              idle_status=$?
              if [[ "$idle_status" -ne 20 ]]; then
                echo "SML_IDLE_PREFLIGHT=ERROR; installation blocked"
                exit 1
              fi
              if [[ "$idle_attempt" -eq 40 ]]; then
                echo "SML_IDLE_PREFLIGHT=BUSY_TIMEOUT; preserve active jobs, no deployment"
                exit 1
              fi
              echo "SML_MEDIA_ACTIVE_WAIT: safe read-only retry in 30s"
              sleep 30
            fi
          done
          echo "SML_IMMUTABLE_APP_ONLY_INSTALL"
          remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA self-media-library"
          if ! remote 'python3 -' <<'PY'
          import json,urllib.request,os
          from pathlib import Path
          # Enforce the real installed binary, not just a successful API/HTML response.
          active=Path('/srv/fresh-website/current/self-media-library').resolve(strict=True)
          downloader=Path('/srv/fresh-website/venvs/self-media-library')/active.name/'bin/yt-dlp'
          assert downloader.is_file() and os.access(downloader,os.X_OK), 'SML yt-dlp missing after deployment'
          source=active/'part01'/'video_merger_downloader.py'
          assert source.is_file(), 'SML video downloader source missing'
          downloader_code=source.read_text()
          assert '"--max-downloads"' not in downloader_code, 'SML download-count limit regression'
          assert '"--no-playlist"' in downloader_code and '"bv*+ba/best/bv*"' in downloader_code
          import subprocess
          face_python=Path('/srv/fresh-website/venvs/self-media-library')/active.name/'bin/python'
          assert face_python.is_file(), 'SML runtime interpreter missing'
          face=subprocess.run([str(face_python),'-c',
              'import cv2,numpy,PIL; assert callable(cv2.FaceDetectorYN.create) and callable(cv2.FaceRecognizerSF.create)'],
              capture_output=True,text=True,timeout=40)
          assert face.returncode==0, 'SML face engine unavailable: '+face.stderr[-500:]
          print('SML_FACE_ENGINE_INSTALLED=PASS',flush=True)
          print('SML_YTDLP_INSTALLED=PASS',flush=True)
          print('SML_YOUTUBE_MERGED_AV_SINGLE_VIDEO=PASS',flush=True)
          def read(p):
              with urllib.request.urlopen('http://127.0.0.1:8147'+p,timeout=25) as r:
                  if r.status!=200: raise RuntimeError('HTTP readback failure')
                  return json.load(r)
          health=read('/api/health')
          status=read('/api/v1/media/status')
          images=read('/api/v1/images?limit=1')
          imports=read('/api/v1/media/imports')
          proxy_state=read('/api/v1/media/proxy')
          assert isinstance(proxy_state.get('profiles'),list), 'SML proxy manager endpoint missing'
          assert isinstance(proxy_state.get('enabled'),bool), 'SML proxy enable status missing'
          assert all('password' not in p and 'has_password' in p for p in proxy_state['profiles']), 'SML proxy secrets exposed'
          assert isinstance(imports.get('items'),list)
          assert all('progress' in item and 'use_proxy' in item for item in imports['items'])
          assert isinstance(imports.get('proxy_configured'),bool), 'SML proxy availability missing'
          storage=read('/api/local/storage')
          assert storage['storage_mode']=='vps_only' and storage['free_bytes']>0
          assert health['drive_enabled'] is False
          assert 'local_library.js' in urllib.request.urlopen('http://127.0.0.1:8147/',timeout=15).read().decode()
          assert health.get('ok') is True and health.get('version')=='2.0.0'
          assert status.get('ok') is True and status.get('v2') is True
          assert isinstance(images.get('items'),list)
          def asset(port,path):
              with urllib.request.urlopen('http://127.0.0.1:'+str(port)+path,timeout=20) as r:
                  assert r.status==200, path
                  return r.read().decode('utf-8')
          index=asset(8147,'/')
          assert 'href="/&#115;tatic/vps1_native_site_shell.css' in index
          assert 'src="/&#115;tatic/vps1_native_site_shell.js' in index
          assert 'href="/self-media-library/static/sml_shared_theme.css' in index
          assert 'src="/self-media-library/static/app.js' in index
          assert index.count('data-page="') >= 5
          assert 'id="importHistory"' in index and 'id="refreshImports"' in index
          assert 'id="importProxyState"' in index
          assert 'id="smlOpenProxyManager"' in index and 'id="smlProxyForm"' in index
          assert 'id="smlProxyEnabled"' in index and 'id="smlProxyList"' in index
          scene_js=asset(18080,'/static/vps1_native_site_shell.js')
          assert 'vps1-native-experiment-tabs' in scene_js
          assert 'app === "library"' in scene_js
          scene_css=asset(18080,'/static/vps1_native_site_shell.css')
          assert '--vps1-sidebar-width:214px' in scene_css
          theme=asset(8147,'/static/sml_shared_theme.css')
          assert '#f8fafc' in theme and '#315edb' in theme and 'color-scheme:light' in theme
          app_js=asset(8147,'/static/app.js')
          assert 'const libraryPath = path =>' in app_js
          assert 'fetch(libraryPath(url)' in app_js
          assert 'renderImports(items,' in app_js and 'data-import-retry' in app_js
          assert 'data-import-direct' in app_js and 'direct_without_proxy:direct' in app_js
          print('SML_SHARED_SHELL_ASSETS=PASS',flush=True)
          print('SML_UI_LIGHT_THEME_AND_SCOPED_API=PASS',flush=True)
          print('SML_V2_SERVICE_HEALTH=PASS',flush=True)
          print('SML_YOUTUBE_QUEUE_UI_AND_PROGRESS=PASS',flush=True)
          print('SML_YOUTUBE_PROXY_RECOVERY=PASS',flush=True)
          print('SML_PROXY_PROFILE_MANAGER_API_UI=PASS',flush=True)
          print('EDITOR_TOKEN_CONFIGURED='+str(bool(status.get('editor_token_configured'))),flush=True)
          print('DRIVE_ENABLED='+str(bool(health.get('drive_enabled'))),flush=True)
          PY
          then
            echo "SML_V2_FAILED=ROLLBACK"
            remote "sudo -n /usr/local/sbin/vps1-production-deploy rollback $SOURCE_SHA self-media-library" || true
            exit 1
          fi
          echo "SML_V2_APP_RELEASE=HEALTH_VERIFIED"
          echo "AUTO_SCRIPT=OFFLINE_UNCHANGED"
