name: Scene Concat SSO issuer (offline security)
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/concat_sso_issuer.py'
      - 'apps/scene-builder/part01/app.py'
      - 'tests/test_concat_scene_sso_issuer.py'
      - '.github/workflows/vps1-concat-sso-issuer-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scene-concat-sso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse Scene integration and issuer
        run: python -m py_compile apps/scene-builder/part01/app.py apps/scene-builder/part01/concat_sso_issuer.py tests/test_concat_scene_sso_issuer.py
      - name: Concat SSO negative and compatibility tests (offline)
        run: python -m unittest discover -s tests -p test_concat_scene_sso_issuer.py -v
      - name: Existing Scene roles regression (offline)
        run: python -m unittest discover -s tests -p test_scene_user_roles.py -v
      - name: Existing Scene session regression (offline)
        run: python -m unittest discover -s tests -p test_scene_session_sso.py -v
