name: VPS1 Song Studio guarded release
on:
  push:
    branches: [main]
permissions:
  contents: read
# Keep this workflow independent of complete-site workflow scheduling.
# VPS's existing deploy helper still serializes host operations and guards rollback.
jobs:
  deploy:
    # Only eligible jobs reserve host serialization; skipped workflows cannot cancel a release.
    concurrency:
      group: vps1-production-applications
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      contains(github.event.head_commit.message, '[vps1-song-studio-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join existing production tailnet identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Run app-scoped protected-main release command
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
          # Explicit UI-only release avoids restarting unrelated Song Studio apps.
          VOICE_UI_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-song-audio-selector-only]') && '1' || '0' }}
          SONG_UPLOADER_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-song-uploader-only]') && '1' || '0' }}
          SONG_MAKER_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-song-maker-only]') && '1' || '0' }}
          AUDIO_URL_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-song-audio-url-only]') && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          # Only one app selector may be set; never deploy another app implicitly.
          # The song-maker path uses its exact dedicated installer and idle fence.
          if (( AUDIO_URL_ONLY + SONG_UPLOADER_ONLY + VOICE_UI_ONLY + SONG_MAKER_ONLY > 1 )); then
            echo 'Conflicting Song Studio release selectors'; exit 1
          fi
          # Serialized, app-scoped installers retain their own idle/backup/rollback
          # checks. Voice uses its template-only path from the merge intent.
          if [[ "$SONG_MAKER_ONLY" == "1" ]]; then
            apps=(song-maker)
          elif [[ "$AUDIO_URL_ONLY" == "1" ]]; then
            apps=(scene-builder)
          elif [[ "$SONG_UPLOADER_ONLY" == "1" ]]; then
            apps=(local-upload-manager)
          elif [[ "$VOICE_UI_ONLY" == "1" ]]; then
            apps=(voice-studio)
          else
            apps=(scene-builder voice-studio local-upload-manager song-maker)
          fi
          for app in "${apps[@]}"; do
            echo "SONG_STUDIO_RELEASE_START=$app"
            timeout 2100s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 \
              "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
            echo "SONG_STUDIO_RELEASE_PASS=$app"
          done
          echo 'AUTO_SCRIPT=OFFLINE'
