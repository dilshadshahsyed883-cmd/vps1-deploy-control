name: Kokoro website UI audit regressions
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/static/vps1_native_site_shell.*'
      - 'apps/scene-builder/part01/templates/base.html'
      - 'tests/test_ui_audit12.py'
      - '.github/workflows/vps1-kokoro-ui-audit-ci.yml'
permissions:
  contents: read
jobs:
  ui-audit12:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0 jinja2==3.1.6
      - run: python -m playwright install --with-deps chromium
      - run: node --check apps/scene-builder/part01/static/vps1_native_site_shell.js
      - run: node --test tests/test_scene_native_sidebar_role.js
      - run: python -m unittest tests.test_ui_audit12 production.test_scene_video_studio_shell -v
      - run: python tests/test_ui_audit12.py --browser
