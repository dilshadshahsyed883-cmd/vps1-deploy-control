name: VPS1 one-time CI SSH proof (READ ONLY - NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/vps1-main-ssh-proof-once.yml'
      - '.github/workflows/vps1-pilot-deploy.yml'
      - '.github/workflows/vps1-audio-404-probe.yml'
      - '.github/workflows/vps1-connection-check.yml'
      - '.github/scripts/verify_vps1_security_integration.py'
      - '.github/workflows/fresh-vps-post-snapshot-stage.yml'
      - '.github/workflows/fresh-vps-source-of-truth.yml'
      - '.github/workflows/vps1-staging-drift.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps1-main-ssh-proof-once.yml'

permissions:
  contents: read

concurrency:
  group: vps1-one-time-ci-ssh-proof
  cancel-in-progress: false

jobs:
  source-contract:
    if: ${{ github.event_name == 'pull_request' }}
    name: validate-git-source-of-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify migration security invariants (offline)
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/verify_vps1_security_integration.py
          echo 'GITHUB_INTEGRATION_SECURITY_CONTRACT=PASS'
      - name: Verify existing main-branch pilot and release tests offline
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -v
          python3 tools/build_pilot.py
          python3 tools/validate_release.py --manifest dist/release.json
          echo 'GITHUB_PROOF_OFFLINE_TESTS=PASS'

  main-readonly-ssh:
    # Fail closed until production-environment credentials and repository fallback are verified.
    # Only a separately reviewed change may re-enable this remote read-only proof.
    name: main-only-oidc-ssh-readback
    environment: production
    if: >-
      false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'PENDING_SEPARATE_AUTHORIZATION' &&
      contains(github.event.head_commit.message, '[vps1-ssh-proof-authorized]')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject replay or unexpected ref before OIDC
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo 'SSH_PROOF_RERUN=BLOCKED'; exit 1; }
          test "$GITHUB_EVENT_NAME" = "push" || { echo 'SSH_PROOF_EVENT=BLOCKED'; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'SSH_PROOF_REF=BLOCKED'; exit 1; }
      - name: Join restricted tailnet with main-only GitHub OIDC tag:ci
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Authenticate existing non-root SSH identity (NO VPS changes)
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [ -n "${PRIVATE_IDENTITY:-}" ] || { echo 'VPS1_SSH_PRIVATE_KEY_UNAVAILABLE=BLOCKED'; exit 1; }
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/identity"
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          expected='SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          test "$actual" = "$expected" || { echo 'SSH_IDENTITY_FINGERPRINT=BLOCKED'; exit 1; }
          echo 'SSH_IDENTITY_FINGERPRINT=PASS'
          # Agent 1 verified fresh-VPS ED25519 host public key on 2026-10-18; never trust unauthenticated ssh-keyscan.
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          timeout 75s ssh -T -p 22 -i "$scratch/identity" \
            -o UserKnownHostsFile="$scratch/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o UpdateHostKeys=no \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=20 \
            vps1deploy@100.87.55.92 \
            'set -eu; test "$(id -un)" = vps1deploy; test "$(id -u)" != 0; if id -Gn | grep -Eq "(^| )(sudo|wheel)( |$)"; then echo PRIVILEGED_GROUP=BLOCKED; exit 1; fi; echo VPS1_SSH_USER_NONROOT=PASS; echo VPS1_REMOTE_READ_ONLY=PASS'
          echo 'VPS1_GITHUB_OIDC_SSH_AUTH=PASS'
          echo 'VPS1_DEPLOYMENT=NOT_ATTEMPTED'
