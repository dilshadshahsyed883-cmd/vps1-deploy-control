name: VPS1 Native Studio coordinated production release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Only this guarded native-site release shares the coordinator lane.
  # Other push-triggered releases may cancel the generic vps1-production group
  # before any job starts. VPS host-side production lock still serializes installs.
  group: vps1-native-studio-production
  cancel-in-progress: false
jobs:
  native-studio-release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      github.run_attempt == 1 &&
      (contains(github.event.head_commit.message, '[vps1-native-studio-release]') ||
       contains(github.event.head_commit.message, '[vps1-video-geometry-release]') ||
       contains(github.event.head_commit.message, '[vps1-ui-shell-phase-b-release]') ||
       contains(github.event.head_commit.message, '[vps1-unified-sidebar-release]') ||
       contains(github.event.head_commit.message, '[vps1-three-app-ui-release]') ||
       contains(github.event.head_commit.message, '[vps1-website-reaudit-release]') ||
       contains(github.event.head_commit.message, '[vps1-website-reaudit-recovery]'))
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join previously configured protected VPS1 tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Staged native apps first and guarded Scene last
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
          VIDEO_GEOMETRY_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-video-geometry-release]') }}
          VIDEO_TEMPLATE_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-video-template-only]') }}
          UI_SHELL_PHASE_B: ${{ contains(github.event.head_commit.message, '[vps1-ui-shell-phase-b-release]') }}
          UNIFIED_SIDEBAR_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-unified-sidebar-release]') }}
          WEBSITE_REAUDIT: ${{ contains(github.event.head_commit.message, '[vps1-website-reaudit-release]') }}
          WEBSITE_REAUDIT_RECOVERY: ${{ contains(github.event.head_commit.message, '[vps1-website-reaudit-recovery]') }}
          THREE_APP_UI_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-three-app-ui-release]') }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/identity"
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          remote() {
            timeout 2400s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 "$@"
          }
          # Resume only apps that the previous guarded release could not reach.
          # Storage UI belongs to Scene Builder; its independent backend source is unchanged.
          if [[ "$WEBSITE_REAUDIT_RECOVERY" == "true" ]]; then
            for app in scene-builder video-merger; do
              echo "WEBSITE_REAUDIT_RECOVERY_STAGE=$app"
              remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
              echo "WEBSITE_REAUDIT_RECOVERY_PASS=$app"
            done
            echo "WEBSITE_REAUDIT_RECOVERY=PASS"
            echo "AUTO_SCRIPT=OFFLINE"
            exit 0
          fi
          if [[ "$WEBSITE_REAUDIT" == "true" ]]; then
            for app in auto-caption-studio voice-studio self-media-library short-stream video-merger vps-storage-manager scene-builder; do
              echo "WEBSITE_REAUDIT_STAGE=$app"
              remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
              echo "WEBSITE_REAUDIT_STAGE_PASS=$app"
            done
            echo "WEBSITE_REAUDIT_RELEASE=PASS"
            echo "INDEPENDENT_WORKERS=PRESERVED AUTO_SCRIPT=OFFLINE"
            exit 0
          fi
          # Single-host serialized release for the Kokoro-reference UI parity
          # of Scene Queue/Settings/Audit, Antidetect and OmniVoice. The Scene
          # candidate owns experiment/static/UI source. Voice MUST use the
          # allowlisted template-only overlay; its dedicated engine workers do
          # not restart and all other applications are untouched.
          if [[ "$THREE_APP_UI_ONLY" == "true" ]]; then
            echo "THREE_APP_UI_RELEASE=BEGIN"
            remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA scene-builder"
            echo "THREE_APP_SCENE=PASS"
            remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA voice-studio"
            echo "THREE_APP_OMNIVOICE_UI=PASS"
            echo "THREE_APP_UI_RELEASE=PASS"
            echo "OTHER_APP_WORKERS=UNCHANGED"
            echo "AUTO_SCRIPT=OFFLINE"
            echo "OWNER_FUNCTIONAL_UAT=PENDING"
            exit 0
          fi
          # Scoped sidebar release installs classic app HTML first, then
          # Scene last, so guarded Scene HTTPS readback verifies both new
          # server-rendered authenticated sidebars before commit.
          # Independent upload/voice/caption engines do not restart.
          if [[ "$UNIFIED_SIDEBAR_ONLY" == "true" ]]; then
            for app in short-maker video-merger scene-builder; do
              echo "UNIFIED_SIDEBAR_STAGE=$app"
              remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
              echo "UNIFIED_SIDEBAR_STAGE_PASS=$app"
            done
            echo "UNIFIED_SIDEBAR_RELEASE=PASS"
            echo "AUTO_SCRIPT=OFFLINE"
            echo "OWNER_FUNCTIONAL_UAT=PENDING"
            exit 0
          fi
          # Shared CSS/JS-only update: the Scene candidate owns /static assets.
          # No restart or reinstallation of independent Voice/ACS/Uploader engines.
          if [[ "$UI_SHELL_PHASE_B" == "true" ]]; then
            echo "UI_SHELL_PHASE_B=BEGIN"
            # The host production lock is non-blocking. Do not race an unrelated
            # active app release: retry only the known lock-busy error, never
            # a failed installer or a failed verification.
            scene_install_done=0
            for attempt in $(seq 1 36); do
              install_output="$(remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA scene-builder" 2>&1)" && {
                printf '%s\n' "$install_output"
                scene_install_done=1
                break
              }
              if [[ "$install_output" != *"BlockingIOError: [Errno 11] Resource temporarily unavailable"* ]]; then
                printf '%s\n' "$install_output" >&2
                exit 1
              fi
              echo "SCENE_UI_HOST_LOCK_BUSY_RETRY=$attempt"
              sleep 15
            done
            if [[ "$scene_install_done" != 1 ]]; then
              echo "SCENE_UI_HOST_LOCK_TIMEOUT" >&2
              exit 1
            fi
            # The Auto Script Kokoro CSS is public and independently verifiable;
            # a failed public asset readback must not report deployment success.
            if [[ "$SOURCE_SHA" == "$(git rev-parse HEAD 2>/dev/null || true)" ]]; then :; fi
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              for attempt in $(seq 1 6); do
                if curl -fsS --connect-timeout 8 --max-time 25 \
                   'https://app.scenebuilder.online/static/auto_script_kokoro_20261026.css?v=1' \
                   -o "$scratch/auto-script-kokoro.css" &&
                   grep -q 'AS-UI-KOKORO-1440-20261026' "$scratch/auto-script-kokoro.css"; then
                  break
                fi
                sleep 5
              done
              grep -q 'AS-UI-KOKORO-1440-20261026' "$scratch/auto-script-kokoro.css"
              echo "AUTO_SCRIPT_KOKORO_PUBLIC_CSS=PASS"
            fi
            if [[ "$VIDEO_TEMPLATE_ONLY" == "true" ]]; then
              for app in short-maker video-merger auto-caption-studio; do
                remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
              done
              echo "VIDEO_UI_OVERLAYS=PASS WORKERS=PRESERVED"
            fi
            echo "UI_SHELL_PHASE_B=PASS SCENE_ONLY=YES"
            echo "INDEPENDENT_APP_RESTARTS=NONE"
            echo "AUTO_SCRIPT=OFFLINE"
            echo "OWNER_FUNCTIONAL_UAT=PENDING"
            exit 0
          fi
          # UI-only four-app release: install shared Scene static CSS first;
          # do not restart Voice or Uploader for this geometry-only change.
          if [[ "$VIDEO_GEOMETRY_ONLY" == "true" ]]; then
            for app in scene-builder short-maker video-merger auto-caption-studio; do
              echo "VIDEO_STUDIO_GEOMETRY_STAGE=$app"
              remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
              echo "VIDEO_STUDIO_GEOMETRY_STAGE_PASS=$app"
            done
            echo "VIDEO_STUDIO_GEOMETRY_RELEASE=PASS"
            echo "AUTO_SCRIPT=OFFLINE"
            echo "OWNER_FUNCTIONAL_UAT=PENDING"
            exit 0
          fi
          for app in short-maker video-merger auto-caption-studio voice-studio local-upload-manager; do
            echo "NATIVE_STUDIO_STAGE=$app"
            remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
            echo "NATIVE_STUDIO_STAGE_PASS=$app"
          done
          echo "NATIVE_STUDIO_SCENE_CUTOVER=BEGIN"
          # The Scene candidate installer verifies all five native app HTTPS
          # routes/documents before committing its release and rolls back on failure.
          remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA scene-builder"
          echo "NATIVE_STUDIO_SCENE_CUTOVER=PASS"
          echo "ALGORITHM_WORKERS=UNCHANGED"
          echo "AUTO_SCRIPT=OFFLINE"
          echo "OWNER_FUNCTIONAL_UAT=PENDING"
