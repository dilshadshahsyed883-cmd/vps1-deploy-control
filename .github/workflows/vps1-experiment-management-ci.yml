name: VPS1 Antidetect Advanced Management CI
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/experiment_browser.py'
      - 'apps/scene-builder/part01/experiment_browser_management.py'
      - 'apps/scene-builder/part01/app.py'
      - 'apps/scene-builder/part01/static/experiment_browser.js'
      - 'apps/scene-builder/part01/static/experiment_browser_management.js'
      - 'apps/scene-builder/part01/static/experiment_browser_management.css'
      - 'apps/scene-builder/part01/templates/experiment_studio.html'
      - 'tests/test_experiment_browser_management.py'
      - 'tests/test_experiment_browser_kokoro_ui.py'
      - '.github/workflows/vps1-experiment-management-ci.yml'
permissions:
  contents: read
jobs:
  management-and-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser management and existing controller syntax
        run: |
          python -m py_compile apps/scene-builder/part01/experiment_browser.py apps/scene-builder/part01/experiment_browser_management.py apps/scene-builder/part01/app.py
          node --check apps/scene-builder/part01/static/experiment_browser.js
          node --check apps/scene-builder/part01/static/experiment_browser_management.js
      - name: Per-user API, storage, migration, batch and existing engine tests
        run: |
          python -m unittest tests.test_experiment_browser_management tests.test_experiment_browser_engine -v
      - name: Desktop and mobile Chromium interaction and overflow
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python -m unittest tests.test_experiment_browser_kokoro_ui -v
          python tests/test_experiment_browser_kokoro_ui.py --browser
