name: Verify isolated pilot (no VPS deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pilot-validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ui-visual:
    name: ui-chromium-visual
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser and pixel comparison dependencies
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0' 'Pillow==11.3.0' 'jinja2==3.1.6'
          python -m playwright install --with-deps chromium
      - name: Real Chromium six-Studio layout and screenshot comparisons
        run: |
          python -m unittest production.test_video_responsive -v
          python production/test_video_responsive.py --browser
          python -m py_compile production/ui_visual_ci.py
          python -m production.shell_v2_browser
          python production/ui_visual_ci.py --screenshots "${{ runner.temp }}/ui-geometry"
      - name: Preserve sanitized non-production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-fixtures-${{ github.sha }}
          path: ${{ runner.temp }}/ui-geometry/*.png
          if-no-files-found: ignore
          retention-days: 7
  offline-pilot:
    needs: ui-visual
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Enforce owner-approved UI design source contract
        run: |
          python3 production/ui_design_contract.py
          python3 -m production.shell_v2_contract
          python3 -m unittest discover -s tests -p 'test_ui_design_governance.py' -v
      - name: Build pilot artifact
        run: python3 tools/build_pilot.py
      - name: Verify archive and release manifest
        run: python3 tools/validate_release.py --manifest dist/release.json
      - name: Lint Bridge-compatible Bash
        run: bash -n scripts/preflight_readonly.sh
      - name: Confirm no deployment job exists
        run: test ! -e .github/workflows/deploy.yml
