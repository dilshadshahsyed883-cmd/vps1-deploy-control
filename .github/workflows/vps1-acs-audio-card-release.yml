name: VPS1 ACS Audio Engine DOM targeted release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: vps1-acs-audio-card-release
  cancel-in-progress: false
jobs:
  release-acs-only:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[vps1-acs-audio-card-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join existing approved Tailscale identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Install only Auto Caption Studio and prove Audio Engine DOM integrity
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/identity"
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          test "$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          remote() {
            timeout 2400s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 "$@"
          }
          echo 'PHASE=ACS_ONLY_AUDIO_ENGINE_DOM'
          remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA auto-caption-studio"
          remote 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.request
          page=Path('/srv/fresh-website/current/auto-caption-studio/part01/web_backend/acs_studio.html')
          html=page.read_text(encoding='utf-8')
          assert html.count('id="acsVoiceProfilesList"')==1
          assert html.count('id="internalAudioEngineCard"')==1
          start=html.split('function renderVoiceProfiles(){',1)[1].split('function updateVoiceSelects(){',1)[0]
          assert "document.getElementById('acsVoiceProfilesList')" in start
          assert ".grid.g2 + .card" not in start
          with urllib.request.urlopen('http://127.0.0.1:8144/health',timeout=10) as response:
              data=json.load(response)
          assert data.get('ok') is True
          print('ACS_AUDIO_ENGINE_CARD_SOURCE=PASS',flush=True)
          print('ACS_WEB_HEALTH=PASS',flush=True)
          print('ACS_RECORDS_NOT_MUTATED_BY_READBACK=PASS',flush=True)
          PY
          REMOTE
          echo 'AUTO_CAPTION_STUDIO=RELEASED'
          echo 'LUM_RELEASE=NOT_EXECUTED'
          echo 'STORAGE_MANAGER_RELEASE=NOT_EXECUTED'
          echo 'AUTO_SCRIPT=OFFLINE'
          echo 'AUDIO_SYNTHESIS_UAT=NOT_PROVEN'
