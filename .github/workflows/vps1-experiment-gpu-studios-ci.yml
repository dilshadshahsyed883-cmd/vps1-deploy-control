name: Experiment Studio GPU Controls CI
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/experiment_gpu_studios.py'
      - 'apps/scene-builder/part01/precutover_policy.py'
      - 'apps/scene-builder/part01/templates/experiment_gpu_studio.html'
      - 'apps/scene-builder/part01/static/experiment_gpu_studio.*'
      - 'apps/scene-builder/part01/templates/base.html'
      - 'apps/scene-builder/part01/static/experiment_four_studio_layout.css'
      - 'apps/scene-builder/part01/templates/cloud_render.html'
      - 'apps/scene-builder/part01/templates/heygen_studio.html'
      - 'apps/scene-builder/part01/static/heygen_studio.*'
      - 'apps/scene-builder/part01/static/vps1_native_site_shell.js'
      - 'tests/test_experiment_gpu_studios.py'
      - 'tests/test_experiment_four_studio_layout.py'
  workflow_dispatch:
jobs:
  safe-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'fastapi==0.115.6' 'starlette==0.41.3' 'httpx==0.28.1' 'jinja2==3.1.6' 'python-multipart==0.0.20' 'itsdangerous==2.2.0'
      - name: Compile backend and run isolated owner/auth/worker tests
        run: |
          python -m py_compile apps/scene-builder/part01/experiment_gpu_studios.py
          python -m py_compile apps/scene-builder/part01/precutover_policy.py
          python -m unittest discover -s tests -p 'test_experiment_gpu_studios.py' -v
          python -m unittest discover -s tests -p 'test_experiment_four_studio_layout.py' -v
