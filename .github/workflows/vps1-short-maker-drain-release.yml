name: VPS1 Short Maker drain-aware guarded release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preflight-live-health:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      contains(github.event.head_commit.message, '[vps1-short-maker-drain-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join existing production tailnet (read-only readiness)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Read-only Short Maker health (root installer proves queue idle before restart)
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          # /api/jobs requires Scene SSO and returns HTTP 401 on direct local calls.
          # No spoofed identity or partial owner snapshot is an idle proof.
          # This only checks liveness. The root-owned guarded install performs
          # the authoritative read-only all-owners job-state gate immediately
          # before stopping Short Maker, and aborts on any unfinished job.
          for attempt in $(seq 1 5); do
            if ssh -T -p 22 -i "$scratch/identity" \
                -o UserKnownHostsFile="$scratch/known_hosts" \
                -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
                -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
                vps1deploy@100.87.55.92 \
                'curl -fsS --max-time 15 http://127.0.0.1:8146/health' > "$scratch/state.json"; then
              if python3 - "$scratch/state.json" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  response = json.load(handle)
              if response.get("ok") is not True or response.get("app") != "short-maker":
                  raise ValueError("Unexpected app health response")
              print("SHORT_MAKER_READ_ONLY_HEALTH=PASS")
          except (OSError, ValueError, AttributeError, TypeError):
              print("SHORT_MAKER_READ_ONLY_HEALTH=UNKNOWN")
              sys.exit(1)
          PY
              then
                echo 'SHORT_MAKER_FINAL_IDLE_PROOF=ROOT_INSTALLER_REQUIRED'
                exit 0
              fi
            fi
            echo "SHORT_MAKER_HEALTH_RETRY=$attempt/5"
            sleep 15
          done
          echo 'SHORT_MAKER_HEALTH_BLOCKED=no deployment attempted'
          exit 1

  deploy:
    needs: preflight-live-health
    if: needs.preflight-live-health.result == 'success'
    concurrency:
      group: vps1-production-applications
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join existing production tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Install only Short Maker with final idle gate and rollback
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          timeout 2100s ssh -T -p 22 -i "$scratch/identity" \
            -o UserKnownHostsFile="$scratch/known_hosts" \
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            vps1deploy@100.87.55.92 \
            "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA short-maker"
          echo 'SHORT_MAKER_GUARDED_RELEASE_PASS=YES'
          echo 'AUTO_SCRIPT=OFFLINE'
