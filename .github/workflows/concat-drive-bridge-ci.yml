name: Restricted Concat Drive Bridge
on:
  push:
    branches: [feature/shared-drive-bridge]
    paths: ['production/concat_drive_bridge.py', 'production/concat-drive-bridge.service', 'production/deploy-concat-drive-bridge-issue16.sh', 'tests/test_concat_drive_bridge.py', '.github/workflows/concat-drive-bridge-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'fastapi==0.115.12' 'requests==2.32.3'
      - name: Canonical Scene import and real Unix socket acceptance
        run: |
          PYTHONPATH=apps/scene-builder/part01 python -c 'from cloud_render import CloudRender; from cloud_render_production import DriveIntake'
          python -m unittest discover -s tests -p 'test_concat_drive_bridge.py' -v
          python -m py_compile production/concat_drive_bridge.py
          bash -n production/deploy-concat-drive-bridge-issue16.sh
