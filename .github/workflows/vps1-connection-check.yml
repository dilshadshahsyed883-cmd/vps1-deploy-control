name: VPS_1 direct connection test (no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vps1-connection-test
  cancel-in-progress: false

jobs:
  check-vps:
    # PHASE 1: fail-closed. Variable alone must never authorize live VPS access.
    if: ${{ false && vars.VPS1_TAILSCALE_READY == 'yes' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Verify VPS_1 is reachable
        run: |
          set -Eeuo pipefail
          timeout 60s tailscale ping -c 2 100.87.55.92
          echo 'VPS1_TAILSCALE_CONNECTIVITY=PASS'
      - name: Verify existing OpenSSH handshake on private Tailscale IP
        run: |
          set -Eeuo pipefail
          # Read-only protocol probe. Does NOT authenticate or trust scanned host keys.
          scan="$(timeout 30s ssh-keyscan -T 10 -p 22 -t rsa,ecdsa,ed25519 100.87.55.92 2>/dev/null)"
          printf '%s\n' "$scan" | grep -Eq '^100[.]113[.]253[.]99 (ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) '
          echo 'VPS1_OPENSSH_PORT22_HANDSHAKE=PASS'
          echo 'VPS1_SSH_AUTHENTICATION=NOT_TESTED'
          echo 'VPS1_DEPLOYMENT=NOT_ATTEMPTED'
