name: VPS1 Auto Stream V2 integration offline CI
on:
  pull_request:
    paths:
      - 'apps/short-stream/part01/**'
      - 'production/test_auto_stream_integrations.py'
      - 'production/test_auto_stream_credentials.py'
      - 'production/test_auto_stream_ui.py'
      - 'production/test_auto_stream_broadcasts.py'
      - 'production/test_auto_stream_oauth_env.py'
      - 'production/auto_stream_oauth_env.py'
      - 'production/runtime.py'
      - '.github/workflows/vps1-auto-stream-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/short-stream/part01/**'
      - 'production/test_auto_stream_integrations.py'
      - '.github/workflows/vps1-auto-stream-v2-ci.yml'
permissions:
  contents: read
jobs:
  v2-integration-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi==0.115.12' 'cryptography==44.0.3' 'python-multipart==0.0.20' 'httpx==0.28.1'
      - name: Isolated offline tests, never connect YouTube
        run: |
          python -m py_compile apps/short-stream/part01/auto_stream_client_config.py
          python -m py_compile apps/short-stream/part01/auto_stream_integrations.py
          python -m py_compile apps/short-stream/part01/app.py
          python -m unittest -v production.test_auto_stream_engine production.test_auto_stream_integrations production.test_auto_stream_ui production.test_auto_stream_broadcasts production.test_auto_stream_oauth_env production.test_auto_stream_credentials

      - name: Parse native browser script with Node JS syntax checker
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys, subprocess
          sys.path.insert(0,str(Path('apps/short-stream/part01').resolve()))
          from auto_stream_ui import PAGE
          source=PAGE.split('<script>',1)[1].split('</script>',1)[0]
          subprocess.run(['node','--check'], input=source, text=True, check=True)
          PY
