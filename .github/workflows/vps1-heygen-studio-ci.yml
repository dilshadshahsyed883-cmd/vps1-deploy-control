name: VPS1 HeyGen Studio Integration CI
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/app.py'
      - 'apps/scene-builder/part01/precutover_policy.py'
      - 'apps/scene-builder/part01/heygen_studio.py'
      - 'apps/scene-builder/part01/heygen_delivery.py'
      - 'apps/scene-builder/part01/heygen_outbox.py'
      - 'apps/scene-builder/part01/templates/base.html'
      - 'apps/scene-builder/part01/templates/heygen_studio.html'
      - 'apps/scene-builder/part01/static/heygen_studio.*'
      - 'tests/test_heygen_studio.py'
      - 'tests/test_heygen_delivery.py'
      - 'tests/test_heygen_outbox.py'
      - 'apps/scene-builder/part01/static/vps1_native_site_shell.js'
      - 'tests/test_scene_native_sidebar_role.js'
      - 'tests/test_experiment_auto_script_navigation.py'
      - '.github/workflows/vps1-heygen-studio-ci.yml'
      - '.github/workflows/vps1-heygen-studio-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heygen-site-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website test-only dependencies
        run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.28,<1" "jinja2>=3.1,<4" "itsdangerous>=2.2,<3" "python-multipart>=0.0.20,<1"
      - name: Syntax and script validation
        run: |
          python -m py_compile apps/scene-builder/part01/heygen_studio.py apps/scene-builder/part01/heygen_delivery.py apps/scene-builder/part01/heygen_outbox.py apps/scene-builder/part01/app.py tests/test_heygen_studio.py tests/test_heygen_delivery.py tests/test_heygen_outbox.py
          node --check apps/scene-builder/part01/static/heygen_studio.js
          node --check apps/scene-builder/part01/static/vps1_native_site_shell.js
      - name: Bridge, security and website tests
        run: |
          python -m unittest tests.test_heygen_studio tests.test_heygen_delivery tests.test_heygen_outbox tests.test_experiment_auto_script_navigation production.test_unified_sidebar_navigation -v
          node --test tests/test_scene_native_sidebar_role.js
      - name: Verify separate GPU repository boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("apps/scene-builder/part01/templates/base.html").read_text()
          app=Path("apps/scene-builder/part01/app.py").read_text()
          # Admin Experiment nav shows only Concat; the non-admin direct link stays intact.
          assert base.count('href="/heygen-studio/"') == 1
          assert '<nav class="vps1-experiment-tabs"' in base
          assert 'href="/cloud-render/">Concat</a>' in base
          shell=Path("apps/scene-builder/part01/static/vps1_native_site_shell.js").read_text()
          nav=shell.split('const EXPERIMENT_NAV = Object.freeze([',1)[1].split(']);',1)[0]
          assert '["Concat", "/cloud-render/", "cloud-render"]' in nav
          assert '["HeyGen Studio",' not in nav
          assert '/heygen-studio/' in shell
          assert 'register_heygen_studio' in app
          assert 'HEYGEN_STUDIO = register_heygen_studio(app, templates, DATA_DIR, require_login, require_login)' in app
          assert 'request.url.path.rstrip("/") == "/heygen-studio" or' not in app
          policy=Path("apps/scene-builder/part01/precutover_policy.py").read_text()
          assert '("POST", "/api/heygen-studio/config")' in policy
          assert Path("apps/scene-builder/part01/static/heygen_studio.js").exists()
          assert Path("apps/scene-builder/part01/templates/heygen_studio.html").exists()
          print("VPS1_OWNS_UI=YES; HEYGEN_REPO_OWNS_GPU_IMAGE=YES")
          release=Path(".github/workflows/vps1-heygen-studio-release.yml").read_text()
          assert "[vps1-heygen-studio-release]" in release
          assert "vps1-production-deploy rollback" in release
          assert "scene-builder" in release
          assert "environment: production" in release
          assert "github.actor == 'dilshadshahsyed883-cmd'" in release
          assert "HEYGEN_GPU_RENDER=NOT_YET_TESTED" in release
          assert "ghcr.io/" not in release
          print("HEYGEN_GUARDED_RELEASE=PASS; GPU_PROVISIONING=NONE")
          PY
