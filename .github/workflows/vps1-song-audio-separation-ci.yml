name: VPS1 Song Audio independent backend CI
on:
  pull_request:
    paths:
      - 'apps/song-studio/**'
      - 'apps/voice-studio/part01/vps1_omnivoice_app.py'
      - 'apps/scene-builder/part01/app.py'
      - 'production/runtime.py'
      - 'production/song_audio_service.py'
      - 'production/song_audio_handoff_preflight.py'
      - 'production/test_song_audio_handoff_preflight.py'
      - 'production/song_audio_cutover.py'
      - 'production/test_song_audio_cutover.py'
      - 'production/smoke.py'
      - 'rebuild/fresh_vps.py'
      - 'rebuild/deploy_control.py'
      - 'tests/test_song_audio_backend_separation.py'
      - '.github/workflows/vps1-song-audio-separation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/song-studio/**'
      - 'production/runtime.py'
      - 'production/smoke.py'
      - 'tests/test_song_audio_backend_separation.py'
      - '.github/workflows/vps1-song-audio-separation-ci.yml'
permissions:
  contents: read
jobs:
  dedicated-song-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Song Audio runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            fastapi==0.115.12 uvicorn==0.34.2 python-multipart==0.0.20 \
            jinja2==3.1.6 itsdangerous==2.2.0 httpx==0.28.1 requests==2.32.3
      - name: Package dedicated Song code without credentials or SQLite
        run: |
          python - <<'PY'
          from rebuild.fresh_vps import sources
          names = {path for path, _content in sources('song-studio')}
          assert 'part01/song_audio_app.py' in names
          assert 'part01/song_audio_downloader_api.py' in names
          assert 'part01/song_tenant.py' in names
          assert 'part01/templates/voice_studio.html' in names
          assert not any(path.endswith(('.db', '.sqlite', '.sqlite3')) for path in names)
          print('SONG_AUDIO_SOURCE_ONLY=PASS')
          PY
      - name: Syntax and protected Song/Voice boundary contracts
        run: |
          python -m compileall -q apps/song-studio/part01 production/song_audio_service.py production/song_audio_handoff_preflight.py production/song_audio_cutover.py
          python -m unittest discover -s tests -p 'test_song_audio_backend_separation.py' -v
          python -m unittest discover -s production -p 'test_song_audio_service.py' -v
          python -m unittest discover -s production -p 'test_song_audio_handoff_preflight.py' -v
          python -m unittest discover -s production -p 'test_song_audio_cutover.py' -v
      - name: Actual standalone Song ASGI and disposable Scene SSO smoke
        run: |
          python -m production.smoke --app song-studio
