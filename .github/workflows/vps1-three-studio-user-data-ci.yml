name: VPS1 three-Studio per-user work isolation (offline)
on:
  pull_request:
    paths:
      - "apps/short-maker/part01/app.py"
      - "apps/video-merger/part01/app.py"
      - "apps/local-upload-manager/part01/lum_engine/**"
      - "apps/copyright-uploader/part01/lum_engine/**"
      - "tests/test_three_studio_user_isolation.py"
      - "tests/test_three_studio_uploader_tenants.py"
      - "tests/test_studio_owner_scoped_recovery.py"
      - "production/studio_tenant_readonly_preflight.py"
      - "tests/test_studio_tenant_readonly_preflight.py"
      - "production/short_uploader_group_release.py"
      - "production/song_uploader_group_summary_release.py"
      - "apps/local-upload-manager/part01/desktop_core/modules/db/queue_repository.py"
      - "apps/copyright-uploader/part01/desktop_core/modules/db/queue_repository.py"
      - "tests/test_studio_tenant_http.py"
      - "apps/voice-studio/part01/audio_downloader_api.py"
      - "tests/test_audio_downloader_queue_history.py"
      - "apps/local-upload-manager/part01/templates/app.html"
      - "apps/copyright-uploader/part01/templates/app.html"
      - "apps/copyright-uploader/part01/templates/copyright_queue.html"
      - "tests/test_shared_uploader_admin_controls_ui.py"
      - ".github/workflows/vps1-three-studio-user-data-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/short-maker/part01/app.py"
      - "apps/video-merger/part01/app.py"
      - "apps/local-upload-manager/part01/lum_engine/**"
      - "apps/copyright-uploader/part01/lum_engine/**"
      - "tests/test_three_studio_user_isolation.py"
      - "tests/test_three_studio_uploader_tenants.py"
      - "tests/test_studio_owner_scoped_recovery.py"
      - "production/studio_tenant_readonly_preflight.py"
      - "tests/test_studio_tenant_readonly_preflight.py"
      - "production/short_uploader_group_release.py"
      - "production/song_uploader_group_summary_release.py"
      - "apps/local-upload-manager/part01/desktop_core/modules/db/queue_repository.py"
      - "apps/copyright-uploader/part01/desktop_core/modules/db/queue_repository.py"
      - "tests/test_studio_tenant_http.py"
      - "apps/voice-studio/part01/audio_downloader_api.py"
      - "tests/test_audio_downloader_queue_history.py"
      - "apps/local-upload-manager/part01/templates/app.html"
      - "apps/copyright-uploader/part01/templates/app.html"
      - "apps/copyright-uploader/part01/templates/copyright_queue.html"
      - "tests/test_shared_uploader_admin_controls_ui.py"
permissions:
  contents: read
jobs:
  owner-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse full Short Maker and Video Merger source
        run: python -m py_compile apps/short-maker/part01/app.py apps/video-merger/part01/app.py apps/voice-studio/part01/audio_downloader_api.py
      - name: Install uploader HTTP test dependencies
        run: python -m pip install -r apps/local-upload-manager/part01/requirements.txt
      - name: Verify admin and non-admin shared controls (offline)
        run: python -m unittest tests.test_shared_uploader_admin_controls_ui -v
      - name: Exercise real HTTP routes as Alice, Bob and admin
        run: |
          python -m unittest tests.test_studio_tenant_http -v
          python -m unittest tests.test_song_uploader_pc_vault_restore -v
      - name: Database-bound owner isolation and unauthenticated direct-access tests
        run: python -m unittest tests.test_three_studio_user_isolation tests.test_three_studio_uploader_tenants tests.test_studio_owner_scoped_recovery tests.test_studio_tenant_readonly_preflight -v
