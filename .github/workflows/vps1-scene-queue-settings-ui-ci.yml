name: Scene Builder Queue and Settings scoped UI CI
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/templates/queue.html'
      - 'apps/scene-builder/part01/templates/settings.html'
      - 'apps/scene-builder/part01/static/scene_queue_kokoro_ui_20261021.css'
      - 'tests/test_scene_queue_settings_ui_20261021.py'
      - 'tests/test_scene_completed_video_actions_20261021.py'
      - 'apps/scene-builder/part01/app.py'
      - 'production/scene_cancelled_delete_web_release.py'
      - 'tests/test_scene_cancelled_delete_web_release_20261026.py'
      - 'apps/scene-builder/part01/precutover_policy.py'
      - 'production/scene_manual_start_web_release.py'
      - 'production/runtime.py'
      - 'tests/test_scene_manual_start_web_release_20261026.py'
      - '.github/workflows/vps1-scene-queue-settings-ui-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-ui-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Offline Scene Builder regression checks
        run: python3 -m unittest discover -s tests -p 'test_scene_queue_settings_ui_20261021.py' -v
      - name: Validate safe web-only Scene manual Start recovery
        run: python3 -m unittest tests.test_scene_manual_start_web_release_20261026 -v
      - name: Verify web-only cancelled-project Delete and Start isolation
        run: python3 -m unittest tests.test_scene_cancelled_delete_web_release_20261026 -v
      - name: Scene completed MP4 preview/download contracts and real Node UI behavior
        run: python3 -m unittest discover -s tests -p 'test_scene_completed_video_actions_20261021.py' -v
