name: VPS1 Copyright Studio guarded release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    concurrency:
      group: vps1-production-applications
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      contains(github.event.head_commit.message, '[vps1-copyright-studio-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join the existing authorized tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Locked SHA-pinned isolated deployment with guarded per-app rollback
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
          COPYRIGHT_UI_ONLY: ${{ contains(github.event.head_commit.message, '[vps1-copyright-uploader-ui]') }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          # The pinned root helper's allowlist intentionally remains unchanged.
          # local-upload-manager is the approved SSH lane; exact commit intent
          # dispatches to the NEW isolated copyright-uploader service only.
          # Shared LUM/Song/Short services and queues must never restart.
          remote() {
            local operation="$1" target="$2"
            timeout 2100s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 \
              "sudo -n /usr/local/sbin/vps1-production-deploy $operation $SOURCE_SHA $target"
          }
          completed=()
          on_failure() {
            local original_exit="$?"
            trap - ERR
            echo "COPYRIGHT_STUDIO_GUARDED_FAILURE=ROLLBACK_STARTED"
            for ((idx=${#completed[@]}-1; idx>=0; idx--)); do
              local restored="${completed[$idx]}"
              local target="$restored"
              if [[ "$restored" == "copyright-uploader" ]]; then target=local-upload-manager; fi
              echo "COPYRIGHT_STUDIO_ROLLBACK_START=$restored"
              if remote rollback "$target"; then
                echo "COPYRIGHT_STUDIO_ROLLBACK_PASS=$restored"
              else
                echo "::error::COPYRIGHT_STUDIO_ROLLBACK_FAILED=$restored; manual recovery required"
              fi
            done
            exit "$original_exit"
          }
          trap on_failure ERR
          # Ordered: isolated uploader first, Video Merger only when idle,
          # navigation-only Scene web release last. No automatic uploads.
          release_apps=(copyright-uploader video-merger scene-builder)
          if [[ "$COPYRIGHT_UI_ONLY" == 'true' ]]; then
            release_apps=(copyright-uploader)
          fi
          for app in "${release_apps[@]}"; do
            target="$app"
            if [[ "$app" == "copyright-uploader" ]]; then target=local-upload-manager; fi
            echo "COPYRIGHT_STUDIO_INSTALL_START=$app"
            remote install "$target"
            completed+=("$app")
            echo "COPYRIGHT_STUDIO_INSTALL_PASS=$app"
          done
          trap - ERR
          echo 'AUTO_SCRIPT=OFFLINE'
