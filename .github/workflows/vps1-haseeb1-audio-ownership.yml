name: VPS1 haseeb1 Audio Downloader legacy owner CI
on:
  pull_request:
    paths:
      - "production/studio_haseeb1_audio_assignment.py"
      - "production/runtime.py"
      - "tests/test_studio_haseeb1_audio_assignment.py"
      - ".github/workflows/vps1-haseeb1-audio-ownership.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audio-owner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse the migration and production dispatcher
        run: python -m py_compile production/studio_haseeb1_audio_assignment.py production/runtime.py
      - name: Evidence, active jobs, foreign users and rollback regression
        run: python -m unittest tests.test_studio_haseeb1_audio_assignment -v
      - name: Install existing Audio API regression dependencies
        run: python -m pip install fastapi==0.115.12 httpx==0.28.1
      - name: Existing downloader owner scope and Song Maker handoff
        run: python -m unittest tests.test_audio_downloader_queue_history tests.test_audio_song_maker_handoff -v

  run-reviewed-scoped-intent:
    needs: [audio-owner-tests]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      (contains(github.event.head_commit.message, '[vps1-haseeb1-audio-readonly]') ||
       contains(github.event.head_commit.message, '[vps1-haseeb1-audio-apply]'))
    concurrency:
      group: vps1-production-applications
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Join verified Tailscale overlay
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Scoped migration through pinned root helper (no Auto Script)
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/identity"
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          fingerprint="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          helper_status=0
          timeout 480s ssh -T -p 22 -i "$scratch/identity" \
            -o UserKnownHostsFile="$scratch/known_hosts" \
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            vps1deploy@100.87.55.92 \
            "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA voice-studio" \
            > "$scratch/receipt.log" 2>&1 || helper_status=$?
          if [ "$helper_status" -ne 0 ]; then
            echo "HASEEB1_AUDIT_HELPER_EXIT=$helper_status"
            # Exclude generic rollback phase; emit the last safe pre-rollback phase.
            phase="$(grep -Eo 'HASEEB1_MIGRATION_PHASE=[A-Z_]+' "$scratch/receipt.log" | grep -v '=ROLLBACK$' | tail -n 1 || true)"
            if [ -n "$phase" ]; then echo "$phase"; fi
            # Only fixed uppercase machine-readable failure codes are emitted.
            # Never dump raw SSH logs: they may contain private paths or IDs.
            if ! grep -Eo 'HASEEB1_AUDIO_ASSIGNMENT_BLOCKED: [A-Z0-9_]+' "$scratch/receipt.log" | tail -n 1; then
              echo 'HASEEB1_AUDIT_REMOTE_REASON=UNCLASSIFIED'
            fi
            exit 1
          fi
          if git log -1 --format=%B | grep -Fq '[vps1-haseeb1-audio-readonly]'; then
            grep -Fq '"mode": "READ_ONLY"' "$scratch/receipt.log"
            grep -Fq '"target_verified": true' "$scratch/receipt.log"
            echo 'AUDIO_OWNER_PRODUCTION=READ_ONLY'
            grep -Eo '"schema_status": "[A-Z_]+"' "$scratch/receipt.log" || true
            grep -Eo '"schema_missing_jobs": \[[^]]*\]' "$scratch/receipt.log" || true
            grep -Eo '"schema_missing_preferences": \[[^]]*\]' "$scratch/receipt.log" || true
          else
            grep -Fq '"HASEEB1_AUDIO_ASSIGNMENT":' "$scratch/receipt.log"
            if grep -Fq '"state": "OWNERSHIP_VERIFIED"' "$scratch/receipt.log"; then
              echo 'AUDIO_OWNER_PRODUCTION=VERIFIED'
            else
              echo 'AUDIO_OWNER_PRODUCTION=PARTIAL_UNRESOLVED'
              exit 1
            fi
          fi
          grep -Fq '"auto_script": "OFFLINE"' "$scratch/receipt.log"
          grep -Fq '"google_drive": "UNCHANGED"' "$scratch/receipt.log"
          grep -Eo '"(total_jobs|nonterminal_jobs|authenticated_handoff_matches|foreign_handoff_records|unproven_handoff_records|already_owned|eligible|nonterminal_deferred|unproven_legacy|foreign_owner|handoff_conflict|claimed_now)": [0-9]+' "$scratch/receipt.log" || true
