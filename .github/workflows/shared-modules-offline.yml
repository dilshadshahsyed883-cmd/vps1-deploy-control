name: shared-modules-offline
on:
  pull_request:
    paths:
      - 'shared_modules/**'
      - 'tests/test_shared_modules.py'
      - '.github/workflows/shared-modules-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pure shared extraction parity
        run: python3 -m unittest discover -s tests -p 'test_shared_modules.py' -v
