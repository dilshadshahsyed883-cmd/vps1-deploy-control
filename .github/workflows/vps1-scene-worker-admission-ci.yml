name: Scene Builder worker API admission — startup, token, empty queue (no VPS)
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part02/api_server.py'
      - 'rebuild/tests/test_scene_worker_admission.py'
      - '.github/workflows/vps1-scene-worker-admission-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission-only-real-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict minimum API deps (no GPU/media model)
        run: |
          python -m pip install --disable-pip-version-check \
            'fastapi==0.115.12' 'uvicorn==0.34.2' 'python-multipart==0.0.20' \
            'requests==2.32.3' 'pillow==11.1.0' 'httpx==0.28.1'
      - name: Real existing Scene Builder worker FastAPI + protected queue smoke
        run: python -m unittest rebuild.tests.test_scene_worker_admission -v
      - name: Guard all unrelated app deploy/Auto Script flags
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          src=Path('apps/scene-builder/part02/api_server.py').read_text()
          assert "SCENE_WORKER_ADMISSION_ONLY" in src
          assert 'if WORKER_ADMISSION_ONLY:' in src
          assert 'return await call_next(request)' in src
          flags=json.loads(Path('rebuild/groups.json').read_text())
          assert flags['offline_applications']==['auto-script']
          assert not flags['fresh_install_enabled'] and not flags['production_deploy_enabled']
          PY
