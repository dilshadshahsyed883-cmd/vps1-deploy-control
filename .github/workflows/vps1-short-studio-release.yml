name: VPS1 Short Studio guarded release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    concurrency:
      group: vps1-production-applications
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      contains(github.event.head_commit.message, '[vps1-short-studio-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join existing production tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Protected main, scoped installer, idle check and rollback
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_INTENT: ${{ github.event.head_commit.message }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          # Restrict the deployment to the two Short Studio owners only.
          # LUM provisions isolated Short Uploader/8019 and its guarded HTTPS route.
          # Short Maker owns rendering and the shared VPS folder source.
          # Do not redeploy unrelated Video Merger or Scene Builder services.
          apps=(local-upload-manager short-maker)
          # UI-only intent uses the existing isolated Short Uploader installer;
          # it does not restart Song Uploader, Short Maker or any sibling worker.
          if [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-readonly-diagnose]'* ]]; then
            # An existing protected-main root helper handles this marker
            # as READ ONLY. Never install the Short Maker app or touch workers.
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-short-maker-drain-release]'* ]]; then
            # Frozen Phase 1: only Short Maker; root helper enforces idle and rollback.
            # Feature flags remain OFF until later evidence-gated activation.
            apps=(short-maker)
          elif [[ "$RELEASE_INTENT" == *'[vps1-short-maker-only]'* ]]; then
            apps=(short-maker)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-passive-four-unit-prepare]'* ]]; then
            # Passive four-unit environment/sandbox preparation ONLY.
            # Does not stop/restart processes or enable a cooperative lock.
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-cooperation-code-only]'* ]]; then
            # Stage dormant four-unit cooperation source into isolated Short
            # Uploader only; no flags, unrelated worker or Maker restart.
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-fixed-modes]'* ]]; then
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-profile-order-only]'* ]]; then
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-profile-folder-fix]'* ]]; then
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-oauth-vault]'* ]]; then
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-owner-parity]'* ]]; then
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-member-controls]'* ]]; then
            apps=(local-upload-manager)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-assignment-form-only]'* ]] || [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-intro-only]'* ]] || [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-profile-controls]'* ]] || [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-network-fairness]'* ]] || [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-final-ui]'* ]]; then
            apps=(local-upload-manager)
          fi
          for app in "${apps[@]}"; do
            echo "SHORT_STUDIO_RELEASE_START=$app"
            timeout 2100s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 \
              "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app" \
              | { if [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-readonly-diagnose]'* ]]; then cat > "$scratch/readonly"; else cat; fi; }
            if [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-readonly-diagnose]'* ]]; then
              python3 - "$scratch/readonly" <<'PY'
          import json,sys
          lines=open(sys.argv[1],encoding='utf-8').read().splitlines()
          prefix='SHORT_STUDIO_READONLY_DIAGNOSTIC='
          matches=[line[len(prefix):] for line in lines if line.startswith(prefix)]
          if len(matches)!=1:
              raise SystemExit('READONLY_DIAGNOSTIC_MISSING')
          data=json.loads(matches[0])
          if data.get('mode')!='READ_ONLY':
              raise SystemExit('READONLY_DIAGNOSTIC_INVALID')
          config=data.get('cooperation') or {}
          live=data.get('live_cooperation') or {}
          snapshot=data.get('active_drain_snapshot') or {}
          roles=('maker','web','worker','scheduler')
          def role_booleans(source, keys):
              units=source.get('units') or {}
              if not isinstance(units,dict):
                  raise SystemExit('READONLY_UNITS_INVALID')
              return {
                  role:{key:bool((units.get(role) or {}).get(key,False)) for key in keys}
                  for role in roles
              }
          blocked_at=snapshot.get('blocked_at','UNKNOWN')
          allowed={
            'UNKNOWN','NONE','DRAIN_PATH_NOT_CONFIGURED','DRAIN_PATH_UNSAFE',
            'MAKER_ROOT_UNAVAILABLE','MAKER_JOBS_DIRECTORY_UNAVAILABLE',
            'MAKER_JOB_ENTRY_UNSAFE','MAKER_JOB_STATE_MISSING',
            'MAKER_JOB_NOT_TERMINAL','READY_IMPORT_DIRECTORY_UNSAFE',
            'READY_IMPORT_ENTRY_UNSAFE','READY_IMPORT_MANIFEST_MISSING',
            'READY_IMPORT_NOT_TERMINAL','UPLOADER_APP_DB_UNAVAILABLE',
            'UPLOADER_JOB_NOT_TERMINAL','UPLOADER_CLAIM_DB_UNAVAILABLE',
            'UPLOADER_CLAIM_NOT_TERMINAL','INSPECTION_UNREADABLE',
          }
          if blocked_at not in allowed:
            raise SystemExit('READONLY_DRAIN_REASON_INVALID')
          safe={
            'drain_blocked_at':blocked_at,
            'unit_config_flags':role_booleans(config,(
                'configuration_present','folder_root_safe','lock_enabled')),
            'unit_process_flags':role_booleans(live,(
                'running_process_verified','process_lock_flag_verified',
                'process_root_verified')),
            'mode':'READ_ONLY',
            'host_config_status':config.get('status','UNKNOWN'),
            'running_process_status':live.get('status','UNKNOWN'),
            'all_guards_enabled':bool(config.get('all_guards_enabled',False)),
            'same_host_root':bool(config.get('same_host_root_proven',False)),
            'four_processes_same_mount':bool(live.get('four_processes_same_mount_verified',False)),
            'four_processes_lock_flags':bool(live.get('four_processes_lock_flags_verified',False)),
            'maker_jobs_idle_snapshot':bool(snapshot.get('maker_jobs_idle',False)),
            'ready_imports_idle_snapshot':bool(snapshot.get('ready_imports_idle',False)),
            'uploader_jobs_idle_snapshot':bool(snapshot.get('uploader_jobs_idle',False)),
            'uploader_source_claims_idle_snapshot':bool(snapshot.get('uploader_source_claims_idle',False)),
            'active_upload_drain_snapshot_verified':bool(snapshot.get('active_upload_drain_snapshot_verified',False)),
            'active_upload_drain_verified':False,
            'retirement_enabled':False,
            'deployment_performed':False,
          }
          print('SHORT_STUDIO_SANITIZED_VPS_READBACK='+json.dumps(safe,sort_keys=True))
          PY
              echo 'SHORT_STUDIO_DIAGNOSIS=READ_ONLY_NO_DEPLOY'
            else
              echo "SHORT_STUDIO_RELEASE_PASS=$app"
            fi
          done
          echo 'AUTO_SCRIPT=OFFLINE'
