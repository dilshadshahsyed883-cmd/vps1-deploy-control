name: VPS1 Short Studio guarded release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    concurrency:
      group: vps1-production-applications
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      contains(github.event.head_commit.message, '[vps1-short-studio-release]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join existing production tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Protected main, scoped installer, idle check and rollback
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_INTENT: ${{ github.event.head_commit.message }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          actual="$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          # Restrict the deployment to the two Short Studio owners only.
          # LUM provisions isolated Short Uploader/8019 and its guarded HTTPS route.
          # Short Maker owns rendering and the shared VPS folder source.
          # Do not redeploy unrelated Video Merger or Scene Builder services.
          apps=(local-upload-manager short-maker)
          # UI-only intent uses the existing isolated Short Uploader installer;
          # it does not restart Song Uploader, Short Maker or any sibling worker.
          if [[ "$RELEASE_INTENT" == *'[vps1-short-maker-only]'* ]]; then
            apps=(short-maker)
          elif [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-intro-only]'* ]] || [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-profile-controls]'* ]] || [[ "$RELEASE_INTENT" == *'[vps1-shortstudio-network-fairness]'* ]]; then
            apps=(local-upload-manager)
          fi
          for app in "${apps[@]}"; do
            echo "SHORT_STUDIO_RELEASE_START=$app"
            timeout 2100s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 \
              "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA $app"
            echo "SHORT_STUDIO_RELEASE_PASS=$app"
          done
          echo 'AUTO_SCRIPT=OFFLINE'
