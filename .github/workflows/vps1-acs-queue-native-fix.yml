name: VPS1 ACS Queue native visibility production fix
on:
  push:
    branches: [main]
permissions:
  contents: read
# Isolate workflow scheduling; installed VPS release helper still serializes host writes.
concurrency:
  group: vps1-acs-queue-native-fix
  cancel-in-progress: false
jobs:
  restore-acs-native-queue:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[vps1-acs-queue-native-fix]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Join approved VPS1 Tailscale identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Install ACS only, read back CSS and verify service
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/identity"
          unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/identity"
          ssh-keygen -y -P '' -f "$scratch/identity" > "$scratch/public"
          test "$(ssh-keygen -lf "$scratch/public" -E sha256 | awk '{print $2}')" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          remote() {
            timeout 2100s ssh -T -p 22 -i "$scratch/identity" \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 "$@"
          }
          echo ACS_QUEUE_NATIVE_FIX=INSTALLING
          remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA auto-caption-studio"
          remote 'python3 -' <<'PY'
          from pathlib import Path
          import json, urllib.request
          page=Path('/srv/fresh-website/current/auto-caption-studio/part01/web_backend/acs_studio.html')
          assert page.is_file() and not page.is_symlink()
          html=page.read_text(encoding='utf-8')
          assert '#queue.acs-live-reference-v1 > :not(#acs-native-live){display:none!important}' in html
          assert '#queue.acs-live-reference-v1 > #acs-native-live{display:block!important}' in html
          assert '#queue.acs-live-reference-v1 > :not(.acs-live-embed-v1)' not in html
          assert 'id="acs-native-live"' in html and 'id="workers"' in html and 'id="batchRows"' in html
          assert '<iframe class="acs-live-embed-v1"' not in html
          assert 'id="acs-native-live-script"' in html
          with urllib.request.urlopen('http://127.0.0.1:8144/health',timeout=12) as r:
              health=json.load(r)
          assert health.get('ok') is True,health
          print('ACS_NATIVE_QUEUE_VISIBILITY=PASS',flush=True)
          print('ACS_LIVE_WORKER_AND_AUDIT_DOM=PASS',flush=True)
          print('ACS_RUNTIME_HEALTH=PASS',flush=True)
          print('ACS_BACKEND_AND_DATA=UNCHANGED',flush=True)
          PY
          echo ACS_QUEUE_NATIVE_FIX=LIVE_VERIFIED
          echo AUTO_SCRIPT=OFFLINE
          echo OWNER_VISUAL_UAT=PENDING
