name: VPS1 Antidetect Kokoro UI scoped CI
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/templates/experiment_studio.html'
      - 'apps/scene-builder/part01/static/experiment_browser.js'
      - 'apps/scene-builder/part01/static/experiment_antidetect_kokoro_20261021.css'
      - 'tests/test_experiment_browser_kokoro_ui.py'
      - 'tests/test_experiment_browser_shell_alignment.py'
      - '.github/workflows/vps1-experiment-kokoro-ui-ci.yml'
permissions:
  contents: read
jobs:
  experiment-kokoro-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check apps/scene-builder/part01/static/experiment_browser.js
      - run: python -m unittest tests.test_experiment_browser_kokoro_ui -v
      - run: python tests/test_experiment_browser_kokoro_ui.py --browser
      - run: python -m unittest tests.test_experiment_browser_shell_alignment -v
      - run: python tests/test_experiment_browser_shell_alignment.py --browser
