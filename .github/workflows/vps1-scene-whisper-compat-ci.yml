name: Scene Whisper real audio dependency compatibility
on:
  pull_request:
    paths:
      - 'production/scene_whisper_compat.py'
      - 'apps/scene-builder/part01/precutover_policy.py'
      - 'production/scene_production_worker.py'
      - 'production/scene_candidate_release.py'
      - 'apps/scene-builder/part02/requirements.txt'
      - 'tests/test_scene_whisper_compat.py'
      - '.github/workflows/vps1-scene-whisper-compat-ci.yml'
permissions:
  contents: read
jobs:
  real-whisper-decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact production decoder dependencies
        run: python -m pip install 'faster-whisper==1.2.0' 'av==16.1.0' 'requests==2.32.3'
      - name: Decode real audio and verify idle/rollback/project-preservation contracts
        run: python -m unittest tests.test_scene_whisper_compat tests.test_scene_production_worker tests.test_scene_candidate_release -v
