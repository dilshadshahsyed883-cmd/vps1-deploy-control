name: VPS1 SML Scene guarded Editor activation
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: vps1-sml-scene-editor-activation
  cancel-in-progress: false
jobs:
  activate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'dilshadshahsyed883-cmd' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[vps1-sml-scene-activate]')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no Scene source drift from already-live renderer
        shell: bash
        env:
          SCENE_LIVE_SHA: c9309d628eacfc32c906bff80e1807c169c79f12
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git cat-file -e "$SCENE_LIVE_SHA^{commit}"
          git diff --quiet "$SCENE_LIVE_SHA" "$SOURCE_SHA" -- \
            apps/scene-builder \
            production/scene_candidate_release.py \
            production/scene_production_worker.py \
            production/scene_worker_source_refresh.py \
            production/scene_worker_home.py \
            production/scene_sml_worker.py \
            production/scene_sml_render_proof.py \
            production/sml_scene_activation.py \
            production/runtime.py
          echo "SCENE_LIVE_IMMUTABLE_SOURCE_MATCH=PASS"
      - name: Join pinned Tailscale production network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Scene web then SML independent release and private token activation
        shell: bash
        env:
          PRIVATE_IDENTITY: ${{ secrets.VPS1_SSH_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$PRIVATE_IDENTITY" > "$scratch/id"
          unset PRIVATE_IDENTITY
          chmod 0600 "$scratch/id"
          ssh-keygen -y -P '' -f "$scratch/id" > "$scratch/pub"
          actual="$(ssh-keygen -lf "$scratch/pub" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:oeX4vWPvVspKOTrvbMgUa+uWPGyXLz3531TQEy5wp1E'
          printf '%s\n' '100.87.55.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGpN+j9QsIP11NqypSCoYdFZ0Bvy65j608M4EyjC+OlJ' > "$scratch/known_hosts"
          remote() {
            timeout 3000s ssh -T -i "$scratch/id" -p 22 \
              -o UserKnownHostsFile="$scratch/known_hosts" \
              -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              vps1deploy@100.87.55.92 "$@"
          }
          echo 'SML_SCENE_READ_ONLY_PREFLIGHT'
          # Read-only deferral: do not mistake active owner Scene work for an
          # unhealthy system. All other preflight errors abort immediately.
          for idle_attempt in $(seq 1 20); do
            if remote 'python3 -' <<'PY'
          import json,subprocess,urllib.request
          def api(port,route):
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open(f"http://127.0.0.1:{port}{route}",timeout=12) as response:
                  assert response.status==200
                  return json.load(response)
          assert api(18080,'/health').get('ok') is True
          assert api(8147,'/api/health').get('ok') is True
          stats=api(8147,'/api/stats')
          assert int(stats.get('processing',-1))==0,'SML busy or state unknown'
          renderer=api(18081,'/health')
          assert renderer.get('ok') is True and renderer.get('admission_only') is False
          terminal={'completed','failed','cancelled','cleaned'}
          assert isinstance(renderer.get('queue_counts'),dict)
          if any(int(n) for state,n in renderer['queue_counts'].items() if state not in terminal):
              print('SCENE_QUEUE_BUSY: queued or in-flight job; retry later',flush=True)
              raise SystemExit(20)
          worker=api(8000,'/health')
          assert worker.get('admission_only') is True,'Worker ownership changed: abort'
          for service in ('vps1-scene-candidate.service',
                          'vps1-production-self-media-library.service'):
              assert subprocess.run(['systemctl','is-active','--quiet',service]).returncode==0
          print('SML_SCENE_IDLE_AND_WORKER_OWNERSHIP=PASS')
          PY
            then
              break
            else
              idle_code=$?
              if [[ "$idle_code" -ne 20 ]]; then
                echo 'SML_SCENE_PREFLIGHT_ERROR: fail closed'
                exit 1
              fi
              if [[ "$idle_attempt" -ge 20 ]]; then
                echo 'SCENE_QUEUE_STILL_BUSY: leave owner jobs intact'
                exit 1
              fi
              echo "SCENE_PREFLIGHT_SAFE_RETRY $idle_attempt/20"
              sleep 60
            fi
          done
          # Scene web and writable worker are already live at the exactly
          # source-identical approved SHA. Do not restart either or touch owner
          # jobs here. The checkout step proves no Scene code drift at new main.
          echo 'SCENE_WEB_WORKER_READ_ONLY_SOURCE_REUSE'
          remote 'python3 -' <<'PY'
          from pathlib import Path
          import json
          expected='c9309d628eacfc32c906bff80e1807c169c79f12'
          scene=Path('/srv/fresh-website/current/scene-builder').resolve(strict=True)
          assert scene.name == expected, 'Live Scene code changed: cannot reuse source'
          worker=json.loads(Path('/srv/fresh-website/control/state/scene-production-worker.json').read_text())
          assert Path(worker['source']).resolve(strict=True) == scene, 'Renderer source differs from Scene web'
          assert (scene/'part01/sml_scene_bridge.py').is_file(), 'Scene approved catalog bridge missing'
          assert (scene/'part02/sml_worker_bridge.py').is_file(), 'Scene renderer acquisition bridge missing'
          print('SCENE_ALREADY_LIVE_SOURCE_REUSE=PASS')
          PY
          echo 'SML_SOURCE_RELEASE_AND_ATOMIC_PRIVATE_EDITOR_ACTIVATION'
          if ! remote "sudo -n /usr/local/sbin/vps1-production-deploy install $SOURCE_SHA self-media-library"; then
            # The unchanged live Scene renderer was not installed by this job.
            # SML installer owns its own rollback; never roll back Scene here.
            echo 'SML_ACTIVATION_FAILED: Scene owner jobs and source preserved'
            exit 1
          fi
          echo 'SML_SCENE_POST_RELEASE_READBACK'
          remote 'python3 -' <<'PY'
          import json,urllib.request
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def status(port,path):
              with opener.open(f"http://127.0.0.1:{port}{path}",timeout=12) as response:
                  assert response.status==200
                  return json.load(response)
          assert status(8147,'/api/health').get('ok') is True
          assert status(8147,'/api/v1/media/status').get('editor_token_configured') is True
          assert status(18080,'/health').get('ok') is True
          assert status(8000,'/health').get('admission_only') is True
          print('EDITOR_TOKEN_PAIRING_AND_SCENE_WEB_HEALTH=PASS')
          assert status(18081,'/health').get('admission_only') is False
          print('SCENE_RENDERER_SML_TOKEN_AND_THREE_SCENE_MP4=VERIFIED_BY_INSTALLER')
          print('SCENE_RENDERER_ADMISSION_ONLY=UNCHANGED')
          print('SML_SCENE_CREDENTIALS_LOGGED=FALSE')
          print('AUTO_SCRIPT=OFFLINE_UNCHANGED')
          PY
