name: VPS1 Concat Uploader reuse checks

on:
  pull_request:
    paths:
      - 'apps/copyright-uploader/part01/**'
      - 'tests/test_concat_*.py'
      - '.github/workflows/vps1-concat-uploader-reuse-ci.yml'
  push:
    branches:
      - 'feature/concat-uploader-reuse-20261118'
    paths:
      - 'apps/copyright-uploader/part01/**'
      - 'tests/test_concat_*.py'
      - '.github/workflows/vps1-concat-uploader-reuse-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concat-security-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reused uploader Python sources
        run: |
          python -m compileall -q apps/copyright-uploader/part01/lum_engine apps/copyright-uploader/part01/desktop_core
      - name: Install shared uploader runtime dependencies for HTTP smoke
        run: python -m pip install -r apps/copyright-uploader/part01/requirements.txt
      - name: Concat source, ownership and schedule tests
        run: |
          python -m unittest discover -s tests -p 'test_concat_uploader_source.py' -v
          python -m unittest discover -s tests -p 'test_concat_owner_queue.py' -v
          python -m unittest discover -s tests -p 'test_concat_media_schedule.py' -v
          python -m unittest discover -s tests -p 'test_concat_http_auth.py' -v
      - name: Compile Jinja templates
        run: |
          python -m pip install 'jinja2>=3.1,<4'
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          for file in Path('apps/copyright-uploader/part01/templates').glob('*.html'):
              Environment().parse(file.read_text())
          print('Jinja parsing passed')
          PY
