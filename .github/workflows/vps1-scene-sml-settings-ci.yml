name: Scene SML Stock Media settings
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/app.py'
      - 'apps/scene-builder/part01/sml_scene_bridge.py'
      - 'apps/scene-builder/part01/templates/settings.html'
      - 'apps/scene-builder/part01/templates/audit_media.html'
      - 'tests/test_scene_sml_settings.py'
      - '.github/workflows/vps1-scene-sml-settings-ci.yml'
permissions:
  contents: read
jobs:
  sml-settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jinja2
      - run: python -m unittest discover -s tests -p 'test_scene_sml_settings.py' -v
