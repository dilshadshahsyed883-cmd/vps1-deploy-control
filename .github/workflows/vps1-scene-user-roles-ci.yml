name: VPS1 Scene user roles (offline)
on:
  pull_request:
    paths:
      - "apps/scene-builder/part01/app.py"
      - "apps/scene-builder/part01/templates/**"
      - "apps/scene-builder/part01/static/user_management_redesign.css"
      - "apps/scene-builder/part01/static/vps1_native_site_shell.*"
      - "tests/test_scene_native_sidebar_role.js"
      - "production/test_scene_video_studio_shell.py"
      - "production/scene_candidate_release.py"
      - "tests/test_scene_candidate_release.py"
      - "tests/test_scene_user_roles.py"
      - "tests/test_scene_session_sso.py"
      - ".github/workflows/vps1-scene-user-roles-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/scene-builder/part01/app.py"
      - "apps/scene-builder/part01/templates/**"
      - "apps/scene-builder/part01/static/user_management_redesign.css"
      - "apps/scene-builder/part01/static/vps1_native_site_shell.*"
      - "tests/test_scene_native_sidebar_role.js"
      - "production/test_scene_video_studio_shell.py"
      - "production/scene_candidate_release.py"
      - "tests/test_scene_candidate_release.py"
      - "tests/test_scene_user_roles.py"
      - "tests/test_scene_session_sso.py"
      - ".github/workflows/vps1-scene-user-roles-ci.yml"
permissions:
  contents: read
jobs:
  roles-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python parse (no production changes)
        run: python -m py_compile apps/scene-builder/part01/app.py tests/test_scene_user_roles.py tests/test_scene_session_sso.py
      - name: Two-role user behavior regression
        run: python -m unittest discover -s tests -p test_scene_user_roles.py -v
      - name: Shared sidebar JavaScript syntax and real role behavior
        run: |
          node --check apps/scene-builder/part01/static/vps1_native_site_shell.js
          node --test tests/test_scene_native_sidebar_role.js
      - name: Candidate route and native sidebar release contracts
        run: python -m unittest tests.test_scene_candidate_release -v
