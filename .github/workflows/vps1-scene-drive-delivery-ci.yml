name: Scene Builder verified Drive delivery regression
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part01/app.py'
      - 'apps/scene-builder/part01/templates/queue.html'
      - 'apps/scene-builder/part02/api_server.py'
      - 'production/scene_production_worker.py'
      - 'tests/test_scene_drive_delivery_repair_20261022.py'
      - 'tests/test_scene_completed_video_actions_20261021.py'
      - '.github/workflows/vps1-scene-drive-delivery-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drive-delivery-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile changed Python modules
        run: python3 -m py_compile apps/scene-builder/part02/api_server.py apps/scene-builder/part01/app.py production/scene_production_worker.py
      - name: Verify completed MP4 and Drive recovery contracts
        run: python3 -m unittest discover -s tests -p 'test_scene_*drive*20261022.py' -v
      - name: Verify existing completed-video action regression
        run: python3 -m unittest tests.test_scene_completed_video_actions_20261021 -v
