name: Scene Builder effects and full-format FFmpeg regression (offline)
on:
  pull_request:
    paths:
      - 'apps/scene-builder/part02/**'
      - 'rebuild/tests/test_scene_engine_effects.py'
      - '.github/workflows/vps1-scene-engine-effects-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-engine-media-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg and FFprobe
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -h filter=xfade | grep -E 'zoomin|hblur|custom|fadewhite|fadeblack'
      - name: Minimal runtime dependency
        run: python3 -m pip install 'requests==2.32.5'
      - name: Unit + real FFmpeg effects, LUT intensity, karaoke and 720p/1080p landscape/portrait
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MIN_FREE_SPACE_GB: '1'
        run: |
          python3 -m compileall -q apps/scene-builder/part02/smart_scroll apps/scene-builder/part02/api_server.py
          python3 -m unittest rebuild.tests.test_scene_engine_effects -v
      - name: Preserve offline production gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('rebuild/groups.json').read_text())
          assert data['offline_applications']==['auto-script']
          assert data['production_deploy_enabled'] is False
          assert data['fresh_install_enabled'] is False
          PY
