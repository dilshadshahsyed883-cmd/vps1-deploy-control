name: VPS1 ACS Audio Live Dashboard Storage regression (NO VPS)
on:
  pull_request:
    paths:
      - 'apps/auto-caption-studio/part01/web_backend/acs_studio.html'
      - 'apps/auto-caption-studio/part01/web_frontend/templates/live.html'
      - 'apps/scene-builder/part01/app.py'
      - 'apps/scene-builder/part01/static/vps1_native_site_shell.js'
      - 'apps/scene-builder/part01/static/vps1_native_site_shell.css'
      - 'apps/voice-studio/part01/templates/voice_studio.html'
      - 'apps/local-upload-manager/part01/templates/base.html'
      - 'apps/short-maker/part01/app.py'
      - 'apps/video-merger/part01/templates/index.html'
      - 'production/test_scene_video_studio_shell.py'
      - 'production/route_uploader_scene_https.py'
      - 'apps/scene-builder/part01/static/dashboard_control_center.js'
      - 'apps/scene-builder/part01/static/storage_manager.js'
      - 'apps/scene-builder/part01/templates/dashboard.html'
      - 'apps/scene-builder/part01/templates/storage_manager.html'
      - 'production/scene_uploader_ui_release.py'
      - 'production/test_acs_live_dashboard_guardrails.py'
      - 'production/test_scene_uploader_ui_release.py'
      - '.github/workflows/vps1-acs-audio-card-release.yml'
      - '.github/workflows/vps1-acs-dashboard-fixes-ci.yml'
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure backend syntax and source compatibility
        run: python3 -m py_compile apps/scene-builder/part01/app.py apps/auto-caption-studio/part01/web_backend/web_flow_api.py
      - name: Check embedded Studio and Storage JS syntax
        run: |
          node --check apps/scene-builder/part01/static/storage_manager.js
          node --check apps/scene-builder/part01/static/dashboard_control_center.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          body = Path('apps/auto-caption-studio/part01/web_backend/acs_studio.html').read_text()
          script = body.split('<script id="acsAudioEngineRouteAdmission">',1)[1].split('</script>',1)[0]
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp)/'acs.js'
              path.write_text(script)
              subprocess.run(['node','--check',str(path)],check=True)
          PY
      - name: Check native shell and inline ACS Live JavaScript
        run: |
          node --check apps/scene-builder/part01/static/vps1_native_site_shell.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          html=Path('apps/auto-caption-studio/part01/web_backend/acs_studio.html').read_text()
          marker='<script id="acs-native-live-script">'
          assert html.count(marker)==1 and 'id="acs-native-live"' in html
          script=html.split(marker,1)[1].split('</script>',1)[0]
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)/'acs-native-live.js'
              p.write_text(script)
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Install template parser for existing Jinja regression test
        run: python3 -m pip install 'Jinja2==3.1.6'
      - name: Run focused integration regression tests
        run: python3 -m unittest production.test_acs_live_dashboard_guardrails production.test_scene_video_studio_shell production.test_scene_uploader_ui_release -v
      - name: Preserve offline Auto Script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          g=json.loads(Path('rebuild/groups.json').read_text())
          assert g['offline_applications']==['auto-script']
          PY
