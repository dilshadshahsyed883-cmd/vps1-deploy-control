name: VPS1 Song Maker V1 real media and isolation
on:
  pull_request:
    paths: ['apps/song-maker/**', 'production/song_maker_release.py', 'production/remote_deploy.py', 'tests/test_song_maker*.py', 'apps/scene-builder/part01/static/vps1_native_site_shell.js', '.github/workflows/vps1-song-maker-ci.yml']
  push:
    branches: [main]
    paths: ['apps/song-maker/**', 'production/song_maker_release.py', 'tests/test_song_maker*.py', '.github/workflows/vps1-song-maker-ci.yml']
permissions:
  contents: read
jobs:
  song-maker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r apps/song-maker/part01/requirements.txt httpx==0.28.1 jinja2==3.1.6 playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Real FFmpeg, persistent queue, matching, cancellation, isolation and release contracts
        run: python -m unittest discover -s tests -p 'test_song_maker*.py' -v
      - name: Existing applications and shared shell regression
        run: python -m unittest production.test_runtime production.test_canonical_studio_navigation production.test_scene_video_studio_shell production.test_unified_sidebar_navigation -v
      - name: Five-width responsive browser verification
        run: python production/song_maker_browser.py
