name: VPS1 Concat Studio Agent 5 integration security

on:
  push:
    branches:
      - integration/concat-studio-final-20261118
  pull_request:
    paths:
      - 'apps/scene-builder/part01/cloud_render*.py'
      - 'apps/scene-builder/part01/app.py'
      - 'apps/copyright-uploader/part01/lum_engine/concat_*.py'
      - 'production/concat_studio_*.py'
      - 'tests/test_concat_*.py'
      - '.github/workflows/vps1-concat-studio-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-migration-and-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check source, owner migrations and integration
        run: |
          python -m py_compile apps/scene-builder/part01/app.py apps/scene-builder/part01/cloud_render.py apps/scene-builder/part01/cloud_render_production.py apps/scene-builder/part01/cloud_render_owner.py apps/copyright-uploader/part01/lum_engine/concat_source.py
          python -m compileall -q apps/copyright-uploader/part01/lum_engine
      - name: Alice/Bob/Admin migration and queue negative fixtures
        run: python -m unittest tests.test_concat_owner_foundation -v
      - name: Install authenticated HTTP test imports
        run: python -m pip install 'fastapi>=0.110,<1' 'requests>=2.31,<3' 'httpx>=0.27,<1' 'jinja2>=3,<4' 'itsdangerous>=2.2,<3'
      - name: Agent 4 security evidence and existing navigation
        run: |
          python -m unittest tests.test_concat_studio_isolation_audit tests.test_concat_studio_navigation -v
      - name: Assert source-only CI release boundary
        run: |
          git diff --exit-code -- production/scene_public_https.py
          test -f docs/audits/CONCAT_STUDIO_AGENT4_OWNER_ISOLATION_20261118.md
          test -f apps/copyright-uploader/part01/lum_engine/concat_source.py
