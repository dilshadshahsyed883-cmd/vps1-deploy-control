name: VPS1 Self Media Library V2 isolated tests
on:
  pull_request:
    paths: ["apps/self-media-library/**", "tests/test_self_media_library_*.py", ".github/workflows/vps1-self-media-v2-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/self-media-library/**", "tests/test_self_media_library_*.py", ".github/workflows/vps1-self-media-v2-ci.yml"]
permissions:
  contents: read
jobs:
  self-media-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg for real media integration coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr fonts-dejavu-core
          ffmpeg -version | head -n 1
      - name: Install isolated dependencies
        run: python -m pip install -r apps/self-media-library/part01/requirements.txt httpx playwright==1.56.0
      - name: Run library and legacy safety tests
        run: |
          python -m py_compile apps/self-media-library/part01/app.py apps/self-media-library/part01/media_extensions.py apps/self-media-library/part01/media_integrity.py apps/self-media-library/part01/media_catalog.py
          node --check apps/self-media-library/part01/static/app.js
          python -m unittest discover -s tests -p 'test_self_media_library_*.py' -v
          python -m unittest discover -s tests -p test_verified_drive_cleanup_contract.py -v
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/sml-ai-model
            /tmp/sml-speech-model
          key: sml-visual-and-speech-models-vtwo
      - name: Real local model, semantic relevance and persistent worker verification
        env:
          SML_REAL_AI_TEST: '1'
          SML_TEST_MODEL_CACHE: /tmp/sml-ai-model
        run: |
          python -m unittest discover -s tests -p test_self_media_library_ai.py -v
          python -m production.sml_ai_verify --model-cache /tmp/sml-ai-model
      - name: Five-tab native browser regression at mobile tablet desktop
        run: |
          python -m playwright install --with-deps chromium
          python -m production.sml_ai_browser_test
