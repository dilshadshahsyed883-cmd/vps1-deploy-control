name: VPS1 Self Media Library V2 isolated tests
on:
  pull_request:
    paths: ["apps/self-media-library/**", "tests/test_self_media_library_v2.py", ".github/workflows/vps1-self-media-v2-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/self-media-library/**", "tests/test_self_media_library_v2.py", ".github/workflows/vps1-self-media-v2-ci.yml"]
permissions:
  contents: read
jobs:
  self-media-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated dependencies
        run: python -m pip install -r apps/self-media-library/part01/requirements.txt httpx
      - name: Run library and legacy safety tests
        run: |
          python -m py_compile apps/self-media-library/part01/app.py apps/self-media-library/part01/media_extensions.py
          python -m unittest discover -s tests -p test_self_media_library_v2.py -v
          python -m unittest discover -s tests -p test_verified_drive_cleanup_contract.py -v
