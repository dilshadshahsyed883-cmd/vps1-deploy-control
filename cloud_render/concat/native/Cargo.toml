[package]
name = "concat-studio-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "AGPL-3.0-or-later"
description = "Native Rust/Slint Z Builder companion for Concat editing"

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
dirs = "6"
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
keyring = { version = "3.6", features = ["windows-native"] }

[build-dependencies]
slint-build = "=1.18.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
